<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OutLoud!</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OutLoud!">
<meta name="theme-color" content="#0a0a0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" href="icon-192.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--bg2:#121217;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--tx:#f4efe4;--mu:#9b968b;--gold:#d6b36a;--gold2:#f2dca4;--red:#e46a6a;--glass:rgba(22,21,27,.58);--shadow:0 18px 40px rgba(0,0,0,.45);--serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,system-ui,sans-serif}
body.day{--bg:#f4efe5;--bg2:#fbf8f2;--card:rgba(255,255,255,.72);--card2:rgba(60,40,10,.06);--line:rgba(60,40,10,.1);--tx:#1d1b17;--mu:#6f695e;--gold:#a6802f;--gold2:#7d5e1c;--glass:rgba(250,246,238,.62);--shadow:0 14px 30px rgba(60,45,20,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg)}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:420px;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 90% 100% at 50% -40%,rgba(214,179,106,.14),transparent 70%)}
html,body{overflow-x:hidden;max-width:100%}
body.day:before{background:radial-gradient(ellipse 90% 100% at 50% -40%,rgba(214,179,106,.25),transparent 70%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
#app{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:block}
.sub{color:var(--mu);font-size:13px;margin-top:2px;text-transform:capitalize}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:22px}
.sec .more{color:var(--gold);font-size:13px;font-weight:600}
.muted{color:var(--mu)}
.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:#1a150c;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--mu);margin:0 6px 6px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#1a150c}
.badge.out{background:var(--card2);color:var(--gold)}
/* covers */
.cov{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg2);box-shadow:var(--shadow)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:rgba(255,255,255,.85);text-align:center;padding:8px}
.ph small{display:block;font-family:var(--sans);font-size:10px;opacity:.7;margin-top:4px}
/* news */
.news{width:min(40vw,170px)}
.news .t{font-size:15px!important;margin-top:8px!important;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news .a{font-size:12px!important}
.news .m .chip{font-size:10.5px;padding:3px 8px}
.news.prio .cov{box-shadow:0 0 0 2px var(--gold),var(--shadow)}
.av .pic.prio{border-color:var(--gold)}
.prioStar{color:var(--gold);font-size:12px}
.news .t{font-family:var(--serif);font-size:17px;margin-top:10px;line-height:1.2}
.news .a{color:var(--mu);font-size:13px;margin-top:3px}
.news .m{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.news .cov .badge{position:absolute;top:10px;left:10px}
/* artists */
.av{width:84px;text-align:center}
.av .pic{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--bg2);border:2px solid var(--line);box-shadow:var(--shadow)}
.av .pic img{width:100%;height:100%;object-fit:cover}
.av .n{font-size:12.5px;margin-top:7px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 14px}
.grid.alb{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.alb .t{font-size:13.5px;font-weight:600;margin-top:8px;line-height:1.25}
.alb .y{font-size:12px;color:var(--mu);margin-top:2px}
.dec{font-family:var(--serif);font-size:15px;color:var(--gold);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.dec:after{content:"";flex:1;height:1px;background:var(--line)}
/* hero */
.hero{position:relative;margin:calc(-14px - env(safe-area-inset-top)) -18px 0;padding:calc(env(safe-area-inset-top) + 64px) 18px 22px;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .bgi{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:saturate(1.05)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,13,.15),rgba(10,10,13,.55) 55%,var(--bg))}
body.day .hero:after{background:linear-gradient(180deg,rgba(245,240,230,.05),rgba(245,240,230,.6) 60%,var(--bg))}
.hero>*:not(.bgi){position:relative;z-index:1}
.hero h1{font-size:38px;line-height:1.05}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:30;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.hero .star{position:absolute;right:18px;bottom:24px;z-index:2}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mu);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:24px;color:var(--gold)}
.stat span{font-size:12px;color:var(--mu)}
/* timeline */
.tl{position:relative}
.tlr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.tlr .nm{font-size:13px;font-weight:600;line-height:1.2}
.tlr .nm small{display:block;font-weight:400;color:var(--mu);font-size:11px;margin-top:2px}
.bar{position:relative;height:12px;border-radius:6px;background:var(--card)}
.seg{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--mu);opacity:.55}
.seg.now{background:linear-gradient(90deg,var(--gold),var(--gold2));opacity:1}
.axis{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:10.5px;color:var(--mu);margin-top:6px}
.axis div{position:relative;height:14px}
.axis span{position:absolute;transform:translateX(-50%)}
/* tracks */
.trk{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.trk .no{width:22px;text-align:right;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.trk .tt{flex:1;font-size:14.5px}
.trk .du{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.play svg{width:12px;height:12px}
.play.on{background:var(--gold);color:#1a150c}
.stars{display:flex;gap:6px}
.stars button{font-size:28px;color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
/* list rows */
.li{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .th{width:54px;height:54px;flex:none;border-radius:8px;overflow:hidden;background:var(--bg2)}
.li .th.r{border-radius:50%}
.li .th img{width:100%;height:100%;object-fit:cover}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:12.5px;color:var(--mu)}
.date{width:54px;height:58px;flex:none;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.date b{font-family:var(--serif);font-size:22px}
.date span{font-size:10.5px;text-transform:uppercase;color:var(--gold);margin-top:3px;font-weight:700}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 12px}
.jewel{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg2)}
.jewel img{width:100%;height:100%;object-fit:cover}
.jewel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.12));z-index:1}
.jewel:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.28),transparent 35%,transparent 70%,rgba(255,255,255,.08));z-index:1}
/* rifiniture */
#app>*{animation:vin .35s ease both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
a,button{transition:transform .12s ease,opacity .2s}
a:active,button:active{transform:scale(.97)}
.cov,.jewel,.li .th{background:linear-gradient(135deg,rgba(214,179,106,.18),rgba(255,255,255,.03))}
.cov img,.jewel img,.li .th img{color:transparent;font-size:0}
.sec h2{position:relative;padding-left:12px}
.sec h2:before{content:"";position:absolute;left:0;top:.18em;bottom:.18em;width:3px;border-radius:2px;background:linear-gradient(var(--gold2),var(--gold))}
.card{box-shadow:0 1px 0 rgba(255,255,255,.04) inset}
body.day .card{box-shadow:0 6px 18px rgba(80,55,15,.07)}
body.day .cov,body.day .jewel{box-shadow:0 10px 24px rgba(80,55,15,.18)}
body.day nav.bn{box-shadow:0 10px 30px rgba(80,55,15,.15)}
body.day .tab.on{background:#1d1b17;color:#f4efe5}
body.day .chip{background:rgba(60,40,10,.07);color:#6f695e}
.sheet .in{position:relative;padding-top:30px}
.sheet .in:before{content:"";position:absolute;top:10px;left:50%;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line)}
.sheet .x{position:absolute;top:12px;right:14px;z-index:5;width:32px;height:32px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:16px;color:var(--mu)}
body.day .sheet{background:rgba(40,30,10,.3)}
@keyframes fin{from{opacity:0}to{opacity:1}}
.sheet .in{animation:sup .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sup{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* indice alfabetico */
.wtile{width:100%;height:100%;background-size:cover;background-position:center;background-color:rgba(255,255,255,.06);opacity:.55;transition:opacity .6s}.wtile.ok{opacity:1}
.wposter{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1;box-shadow:var(--shadow);display:block;text-align:left}
.wposter .mos{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.wposter:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.82))}
.wposter .lab{position:absolute;left:14px;right:14px;bottom:12px;z-index:1;color:#fff}
.azidx{position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;padding:6px 3px;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.azidx b{font-size:10.5px;line-height:1.38;font-weight:700;color:var(--gold);width:18px;text-align:center}
.azidx b.off{color:var(--mu);opacity:.35}
.azbig{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:70;width:86px;height:86px;border-radius:22px;display:grid;place-items:center;font-family:var(--serif);font-size:48px;color:var(--gold);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);pointer-events:none;opacity:0;transition:opacity .15s}
.azbig.on{opacity:1}
/* nav */
nav.bn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:40;display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(94vw,480px)}
nav.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:20px;font-size:10.5px;color:var(--mu);font-weight:600}
nav.bn a svg{width:22px;height:22px}
nav.bn a.on{color:var(--gold);background:var(--card2)}
/* search */
.sbox{position:relative}
.sbox input{padding-left:42px;border-radius:16px;font-size:16px;height:50px}
.sbox svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--mu)}
/* sheet */
.sheet{animation:fin .25s ease;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet .in{background:var(--bg2);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:70;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);transition:opacity .3s}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.load{display:flex;justify-content:center;padding:40px}
.load .spin{width:26px;height:26px}
.empty{text-align:center;padding:30px 16px;color:var(--mu)}
.empty h3{color:var(--tx);margin-bottom:8px;font-size:20px}
.bio p{line-height:1.6;margin:0 0 12px;font-size:14.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:6px}
.sign{text-align:center;color:var(--mu);font-size:12.5px;margin:40px 0 10px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk{background:var(--bg)}
.chk.on{background:var(--gold);border-color:var(--gold);color:#1a150c}
.ann{border-left:3px solid var(--gold);padding-left:12px}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#060608;overflow:hidden;transition:opacity .9s ease,visibility .9s;display:grid;place-items:center}
#intro.hide{opacity:0;visibility:hidden}
.wall{position:absolute;left:50%;top:50%;width:190vmax;min-height:120vmax;justify-content:center;transform:translate(-50%,-50%) perspective(1000px) rotateX(22deg) rotateZ(-9deg);display:flex;flex-direction:column;gap:14px;opacity:0;transition:opacity 1.4s ease}
.wall.on{opacity:1}
.wrow{display:flex;gap:14px;width:max-content;animation:slide linear infinite}
.wrow.rev{animation-direction:reverse}
.wrow img{width:min(23vmin,170px);aspect-ratio:1;object-fit:cover;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.6);filter:saturate(.85) brightness(.8)}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.beams{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen}
.beams i{position:absolute;top:-10%;width:60%;height:140%;background:conic-gradient(from 180deg at 50% 0,transparent 0 172deg,rgba(242,220,164,.22) 180deg,transparent 188deg);transform-origin:50% 0;animation:sweep 6s ease-in-out infinite alternate}
.beams i:nth-child(1){left:5%}.beams i:nth-child(2){right:5%;animation-delay:-3s;animation-duration:7s}
@keyframes sweep{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
#intro .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,6,8,.3) 0,rgba(6,6,8,.68) 45%,#060608 88%)}
#intro .ctr{position:relative;text-align:center;padding:0 20px}
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:.9}
.lo-out{font-family:var(--sans);font-weight:700;letter-spacing:.62em;font-size:13px;color:var(--gold2);margin:0 0 2px 6px}
.lo-loud{font-family:var(--serif);font-style:italic;font-weight:700;font-size:44px;letter-spacing:-.02em;background:linear-gradient(100deg,#9c7a3c 0%,#f6e2ad 22%,#d6b36a 40%,#fff4d6 50%,#d6b36a 60%,#9c7a3c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;padding-right:6px}
body.day .lo-loud{background-image:linear-gradient(100deg,#6b4f17 0%,#b88a2e 30%,#e0b65a 50%,#b88a2e 70%,#6b4f17 100%)}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
#intro .lo-out{font-size:clamp(14px,3.6vw,20px);opacity:0;animation:fadeup .9s .5s forwards}
#intro .lo-loud{font-size:clamp(78px,22vw,150px);display:flex}
#intro .lo-loud span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(18px) scale(1.08);animation:letter 1s cubic-bezier(.2,.8,.2,1) forwards,shine 6s linear infinite;background:inherit;background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eq{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:34px;margin:18px auto 0}
.eq b{width:5px;border-radius:3px;background:linear-gradient(to top,#9c7a3c,#f2dca4);height:20%;animation:bar .9s ease-in-out infinite alternate}
@keyframes bar{0%{height:12%}100%{height:100%}}
#intro .eq{opacity:0;animation:fadeup .8s 1.2s forwards}
#intro p{color:#b5ad9d;letter-spacing:.38em;text-transform:uppercase;font-size:11px;margin-top:18px;opacity:0;animation:fadeup .9s 1.5s forwards}

}

<body>
<div id="intro"><div class="wall" id="wall"></div><div class="beams"><i></i><i></i></div><div class="vig"></div>
<div class="ctr"><div class="logo"><span class="lo-out">OUT</span><span class="lo-loud" id="ilogo"></span></div><div class="eq" id="ieq"></div><p>la tua musica, ad alta voce</p><button class="ienter" id="ienter">Entra</button><div class="istats" id="istats"></div></div></div>
<div id="app"></div>
<nav class="bn" id="nav"></nav>
<script>
'use strict';
const VER='1.58';
const OWNER_DEFAULT='stich130476';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=encodeURIComponent;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
const DAY=864e5;
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MES3=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

/* ---------- icons ---------- */
const I={
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
ticket:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
disc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 6a6 6 0 0 0-6 6" stroke-linecap="round"/></svg>',
gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
starO:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
starF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/></svg>',
play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>',
pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>',
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M5 12l5 5 9-10"/></svg>',
plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg>'
};

/* ---------- state ---------- */
const LS='outloud-data',LK='outloud-keys';
function blank(){return{v:1,updatedAt:0,artists:{},albums:{},seen:{},diary:[],wrapped:{},settings:{sp:'',tm:''},lastCheck:0}}
let S;try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){S=blank()}
let K;try{K=Object.assign({gh:'',ghUser:OWNER_DEFAULT,ghRepo:'outloud-dati',theme:'dark'},JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){K={gh:'',ghUser:OWNER_DEFAULT,ghRepo:'outloud-dati',theme:'dark'}}
function saveKeys(){localStorage.setItem(LK,JSON.stringify(K))}
let pushT;
function save(sync=true,bump=true){if(bump)S.updatedAt=Date.now();localStorage.setItem(LS,JSON.stringify(S));if(sync&&K.gh){clearTimeout(pushT);pushT=setTimeout(()=>syncNow().catch(()=>{}),2500)}}

/* ---------- cache (IndexedDB) ---------- */
const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('outloud',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
return{async get(k){try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}},
async set(k,v){try{const d=await db();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}}})();
async function cached(key,ttl,fn){const c=await idb.get(key);if(c&&Date.now()-c.t<ttl)return c.v;try{const v=await fn();await idb.set(key,{t:Date.now(),v});return v}catch(e){if(c)return c.v;throw e}}

/* ---------- MusicBrainz (1 req/s, con priorità) ---------- */
const mbQ=[];let mbBusy=false,mbLast=0;
const mbUrl=p=>'https://musicbrainz.org/ws/2/'+p+(p.includes('?')?'&':'?')+'fmt=json';
function mb(path,hi=true){return new Promise((res,rej)=>{const t={path,res,rej};hi?mbQ.unshift(t):mbQ.push(t);pump()})}
let mbSlow=0;
async function pump(){if(mbBusy)return;mbBusy=true;while(mbQ.length){const t=mbQ.shift();const gap=Date.now()<mbSlow?1800:1100;const w=mbLast+gap-Date.now();if(w>0)await sleep(w);mbLast=Date.now();
try{let r;for(let k=0;k<5;k++){r=await fetch(mbUrl(t.path));if(r.status!==503&&r.status!==429)break;mbSlow=Date.now()+60e3;await sleep(1500*(k+1));mbLast=Date.now()}
if(!r.ok)throw new Error('MusicBrainz '+r.status);t.res(await r.json())}catch(e){t.rej(e)}}mbBusy=false}
const mbc=(path,ttl=7*DAY,hi=true)=>cached('mb:'+path,ttl,()=>mb(path,hi));

/* ---------- Deezer (JSONP): foto artisti, copertine di riserva, anteprime ---------- */
let dzN=0,dzLast=0,dzChain=Promise.resolve();
function dzRaw(path){return new Promise((res,rej)=>{const cb='__dz'+(++dzN);const s=document.createElement('script');const to=setTimeout(()=>{clean();rej(new Error('timeout'))},9000);
function clean(){clearTimeout(to);delete window[cb];s.remove()}window[cb]=d=>{clean();if(d&&d.error)rej(new Error('deezer '+(d.error.code||'')));else res(d)};s.onerror=()=>{clean();rej(new Error('deezer'))};
s.src='https://api.deezer.com/'+path+(path.includes('?')?'&':'?')+'output=jsonp&callback='+cb;document.head.appendChild(s)})}
/* Deezer accetta circa 50 richieste ogni 5 secondi: le metto in fila (8 al secondo) e riprovo se è occupato */
function dz(path){const p=dzChain.then(async()=>{const w=dzLast+125-Date.now();if(w>0)await sleep(w);dzLast=Date.now()}).then(async()=>{for(let t=0;t<3;t++){try{return await dzRaw(path)}catch(e){if(t===2)throw e;await sleep(1500*(t+1))}}});dzChain=p.catch(()=>{});return p}
const photoMem={};
function artistPhoto(name){if(!name)return Promise.resolve('');if(photoMem[name])return photoMem[name];
return photoMem[name]=(async()=>{const key='ph2:'+name;const c=await idb.get(key);if(c&&(c.v?Date.now()-c.t<30*DAY:Date.now()-c.t<2*DAY))return c.v;
let u='';try{const d=await dz('search/artist?limit=8&q='+enc(name));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.name)===norm(name))||L.find(a=>norm(a.name).startsWith(norm(name)))||null;const x=m&&m.picture_xl;if(x&&!/\/artist\/\//.test(x))u=x}catch(e){if(c&&c.v)return c.v}
if(!u&&mbQ.length<3){const a=Object.values(S.artists).find(x=>norm(x.name)===norm(name));if(a){try{const j=await mbc(`artist/${a.mbid}?inc=url-rels`,30*DAY,false);const wd=(j.relations||[]).find(r=>r.type==='wikidata');if(wd){const w=await wikiInfo(wd.url.resource.split('/').pop());u=w.img||''}}catch(e){}}}
await idb.set(key,{t:Date.now(),v:u});return u})().catch(()=>'')}
function dzCover(artist,title){return cached('dzc:'+artist+'|'+title,30*DAY,async()=>{const d=await dz('search/album?limit=5&q='+enc(`artist:"${artist}" album:"${title}"`));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.title)===norm(title))||L[0];return (m&&m.cover_xl)||''}).catch(()=>'')}
function dzPreview(artist,title){return cached('dzt:'+artist+'|'+title,30*DAY,async()=>{const d=await dz('search/track?limit=5&q='+enc(`artist:"${artist}" track:"${title}"`));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.title)===norm(title))||L[0];return (m&&m.preview)||''}).catch(()=>'')}

/* ---------- copertine ---------- */
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function phHTML(title,sub){const h=hue(title);const ini=String(title||'?').replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'♪';
return `<div class="ph" style="background:linear-gradient(135deg,hsl(${h},35%,28%),hsl(${(h+50)%360},40%,14%))"><div>${esc(ini)}${sub?`<small>${esc(sub)}</small>`:''}</div></div>`}
function caa(id,sz=250){return `https://coverartarchive.org/release-group/${id}/front-${sz}`}
let covMap;try{covMap=JSON.parse(localStorage.getItem('ol-cov')||'{}')}catch(e){covMap={}}
function saveCov(){try{localStorage.setItem('ol-cov',JSON.stringify(covMap))}catch(e){}}
function coverImg(id,artist,title,sz=250){const alt=covMap[id];if(alt==='-')return phHTML(title,artist);return `<img loading="lazy" src="${alt||caa(id,sz)}" data-id="${id}" data-a="${esc(artist)}" data-t="${esc(title)}" onerror="coverFail(this)" onload="wallAdd(this)" alt="">`}
let wallT,wallL;try{wallL=JSON.parse(localStorage.getItem('ol-wall')||'[]')}catch(e){wallL=[]}
window.wallAdd=function(el){const u=el.currentSrc||el.src;if(!u||u.startsWith('data:')||wallL.includes(u))return;wallL.unshift(u);if(wallL.length>140)wallL.length=140;clearTimeout(wallT);wallT=setTimeout(()=>{try{localStorage.setItem('ol-wall',JSON.stringify(wallL))}catch(e){}},1500)};
window.coverFail=async function(el){const id=el.dataset.id;if(el.dataset.tried){if(id){covMap[id]='-';saveCov()}el.outerHTML=phHTML(el.dataset.t,el.dataset.a);return}el.dataset.tried=1;if(id&&covMap[id]){delete covMap[id];saveCov()}
const u=await dzCover(el.dataset.a,el.dataset.t);if(u){el.src=u;if(id){covMap[id]=u;saveCov()}}else{if(id){covMap[id]='-';saveCov()}el.outerHTML=phHTML(el.dataset.t,el.dataset.a)}};
function avatar(name,cls='pic'){const id='p'+Math.random().toString(36).slice(2);artistPhoto(name).then(u=>{const e=document.getElementById(id);if(e)e.innerHTML=u?`<img src="${u}" alt="" loading="lazy" onload="wallAdd(this)">`:phHTML(name)});return `<div class="${cls}" id="${id}">${phHTML(name)}</div>`}

/* ---------- date ---------- */
function fmtDate(d){if(!d)return'data ignota';const p=d.split('-');if(p.length===1)return p[0];if(p.length===2)return MESI[+p[1]-1]+' '+p[0];return (+p[2])+' '+MESI[+p[1]-1]+' '+p[0]}
const today=()=>new Date().toISOString().slice(0,10);
function daysTo(d){if(!d||d.length<10)return null;return Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/DAY)}
function whenBadge(d){const n=daysTo(d);if(n===null)return'';if(n>1)return`<span class="badge out">tra ${n} giorni</span>`;if(n===1)return'<span class="badge out">domani</span>';if(n===0)return'<span class="badge">esce oggi</span>';return''}
function typeOf(rg){const p=rg['primary-type']||rg.p||'';const s=rg['secondary-types']||rg.s||[];if(s.includes('Compilation'))return'Raccolta';if(s.includes('Live'))return'Live';if(s.includes('Soundtrack'))return'Colonna sonora';if(s.includes('Remix'))return'Remix';if(s.includes('Demo'))return'Demo';return({Album:'Album',Single:'Singolo',EP:'EP'})[p]||'Altro'}

/* ---------- discografia ---------- */
async function discography(mbid,hi=true,fresh=false){const key='disc:'+mbid;
if(!fresh){const c=await idb.get(key);if(c&&Date.now()-c.t<5*DAY)return c.v}
let out=[],off=0,tot=1;while(off<tot&&off<400){const j=await mb(`release-group?artist=${mbid}&limit=100&offset=${off}`,hi);tot=j['release-group-count']||0;
for(const r of j['release-groups']||[])out.push({id:r.id,t:r.title,d:r['first-release-date']||'',p:r['primary-type']||'',s:r['secondary-types']||[]});off+=100}
await idb.set(key,{t:Date.now(),v:out});return out}

/* ---------- controllo novità ---------- */
let checking=null;
const PRIO_INIT=['The Smashing Pumpkins','Radiohead','Ministri','Foo Fighters','Calcutta','Blur','Silversun Pickups','The Zen Circus'];
const isPrio=id=>!!(S.artists[id]&&S.artists[id].prio);
window.togglePrio=function(id){const a=S.artists[id];if(!a)return;a.prio=!a.prio;a.u=Date.now();save();toast(a.prio?`★ ${a.name} tra le priorità`:`${a.name} tolto dalle priorità`);return a.prio};

function spSave(j){K.spTok=j.access_token;K.spExp=Date.now()+(j.expires_in||3600)*1000-60000;if(j.refresh_token)K.spRef=j.refresh_token;saveKeys()}

const o=T[k]||(T[k]={t:baseTitle(t),score:0,src:new Set()});o.score+=Math.max(0,50-pos);o.src.add(src);for(const [kk,v] of Object.entries(extra||{}))if(v&&!o[kk])o[kk]=v};

(j.items||[]).forEach(v=>{const ti=(v.snippet?.title||'').replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"');const ch=norm(v.snippet?.channelTitle||'');if(!norm(ti).includes(an)&&!ch.includes(an))return;
let t=ti.replace(new RegExp('^\\s*'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[-–—:|]\\s*','i'),'').replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s*[|｜].*$/,'').replace(/\b(official|video|lyrics?|audio|hd|4k|videoclip|ufficiale)\b.*$/i,'').trim();if(t&&norm(t)!==an)add(t,'yt',i++,{})})}catch(e){}}
try{const sp=await spTop(name);if(sp)sp.forEach((x,i)=>add(x.name,'sp',i*2.5,{album:x.album?.name||'',cover:(x.album?.images||[]).slice(-2)[0]?.url||'',dur:x.duration_ms?`${Math.floor(x.duration_ms/60000)}:${String(Math.round(x.duration_ms/1000)%60).padStart(2,'0')}`:''}))}catch(e){}
try{const r=await jsonp(`https://itunes.apple.com/search?term=${enc(name)}&entity=song&attribute=artistTerm&limit=60&country=it`);let i=0;((r&&r.results)||[]).filter(x=>norm(x.artistName)===norm(name)).forEach(x=>add(x.trackName,'am',i++,{album:x.collectionName||'',cover:(x.artworkUrl100||'').replace('100x100','300x300'),prev:x.previewUrl||'',dur:x.trackTimeMillis?`${Math.floor(x.trackTimeMillis/60000)}:${String(Math.round(x.trackTimeMillis/1000)%60).padStart(2,'0')}`:''}))}catch(e){}
return Object.values(T).map(o=>({...o,score:o.score*(1+0.35*(o.src.size-1)),n:o.src.size,both:o.src.size>1,sp:o.src.has('sp'),src:undefined})).sort((a,b)=>b.score-a.score).slice(0,20)}).catch(()=>[])}

function age(b){const d=new Date(b.length===4?b+'-07-01':b.length===7?b+'-15':b);const n=new Date();let y=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))y--;return y}
function lineups(members,by,ey){if(!members.length)return[];const now=new Date().getFullYear(),end=ey||now;const seg=[];
members.forEach(r=>{const s0=parseInt(r.begin)||by;if(!s0)return;const e0=r.end?parseInt(r.end):(r.ended?null:end);seg.push({n:r.artist.name.split(' ').slice(-1)[0],full:r.artist.name,s:s0,e:e0??end})});
if(!seg.length)return[];const yrs=[...new Set(seg.flatMap(x=>[x.s,x.e+1]))].filter(y=>y<=end).sort((a,b)=>a-b);const out=[];
for(let i=0;i<yrs.length;i++){const y=yrs[i],ny=(yrs[i+1]||end+1)-1;if(y>ny)continue;const nm=[...new Set(seg.filter(x=>x.s<=y&&x.e>=y).map(x=>x.full))];if(!nm.length)continue;
const last=out[out.length-1];if(last&&last.names.join()===nm.join()){last.to=ny;continue}out.push({from:y,to:ny,names:nm})}
return out.length>1?out.slice(-8):[]}

try{rg=await mbc(`release-group/${rgid}?inc=releases+artist-credits+genres+tags`,7*DAY)}catch(e){app.innerHTML=`<div class="empty" style="padding-top:60px"><h3>L'archivio musicale è un po' affollato</h3><p>Riprovo da solo tra qualche secondo…</p><button class="btn" style="margin-top:14px" onclick="render()">Riprova ora</button></div>`;setTimeout(()=>{if(ok())render()},6000);return}if(!ok())return;
if(S.seen[rgid]==='new'){S.seen[rgid]='old';save()}
if(S.albums[rgid]&&(!S.albums[rgid].lo||Date.now()-S.albums[rgid].lo>DAY)){S.albums[rgid].lo=Date.now();save()}
const artist=(rg['artist-credit']||[]).map(c=>c.name+(c.joinphrase||'')).join('')||'';const aid=rg['artist-credit']?.[0]?.artist?.id;
const rels=(rg.releases||[]).filter(r=>r.status==='Official'||!r.status).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
const mine=S.albums[rgid]||{};const genres=(rg.genres?.length?rg.genres:(rg.tags||[])).sort((x,y)=>y.count-x.count).slice(0,5).map(g=>g.name);
app.innerHTML=`<a class="iconbtn back" href="javascript:history.back()">${I.back}</a>
<div style="padding-top:44px;display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:end">
<div class="cov" style="max-width:420px;width:100%;margin:0 auto;border-radius:14px">${coverImg(rgid,artist,rg.title,500)}</div>
<div><div class="small" style="color:var(--gold);font-weight:700;letter-spacing:.12em;text-transform:uppercase">${typeOf(rg)} · ${rg['first-release-date']?rg['first-release-date'].slice(0,4):''}</div>
<h1 style="font-size:32px;line-height:1.1;margin-top:6px">${esc(rg.title)}</h1>
<a href="${aid?'#artista/'+aid:'#'}" style="display:block;font-size:17px;margin-top:6px;color:var(--mu)">${esc(artist)}</a>
<div style="margin-top:6px">${whenBadge(rg['first-release-date'])}</div>
<div style="margin-top:12px">${genres.map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div>
<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:8px"><a class="btn sm" target="_blank" href="https://open.spotify.com/search/${enc(artist+' '+rg.title)}">Ascolta su Spotify</a>
<button class="btn sm ghost" id="cdb" onclick="toggleCD()">${mine.cd?'✓ Ce l\'ho in CD':'Ce l\'ho in CD'}</button></div></div></div>
<div class="sec"><h2>Le mie note</h2></div>
<textarea id="note" rows="3" placeholder="Un ricordo, un pensiero, il brano preferito…" style="margin-top:12px">${esc(mine.n||'')}</textarea>
<div id="info"></div><div class="sec"><h2>Tracce</h2><span class="small muted">tocca ▶ per 30 secondi</span></div><div id="ed"></div><div id="trk">${loading}</div>`;
const drawStars=()=>{if(!$('#stars'))return;$('#stars').innerHTML=[1,2,3,4,5].map(i=>`<button class="${(S.albums[rgid]?.r||0)>=i?'on':''}" data-i="${i}">★</button>`).join('');$('#stars').querySelectorAll('button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;setAlb(rgid,{r:(S.albums[rgid]?.r===i?0:i)},rg,artist,aid);drawStars()})};drawStars();
$('#note').onchange=e=>setAlb(rgid,{n:e.target.value.trim()},rg,artist,aid);
window.toggleCD=()=>{setAlb(rgid,{cd:!S.albums[rgid]?.cd},rg,artist,aid);$('#cdb').textContent=S.albums[rgid]?.cd?'✓ Ce l\'ho in CD':'Ce l\'ho in CD';toast(S.albums[rgid]?.cd?'Aggiunto alla tua mensola':'Tolto dalla mensola')};
if(!rels.length){$('#trk').innerHTML='<div class="card muted">Elenco tracce non disponibile.</div>';return}
let eds=[];try{const bj=await mbc(`release?release-group=${rgid}&inc=media&limit=100`,30*DAY);eds=(bj.releases||[]).map(r=>({id:r.id,t:r.title,dis:r.disambiguation||'',d:r.date||'',c:r.country||'',n:(r.media||[]).reduce((x,m)=>x+(m['track-count']||0),0),m:(r.media||[]).length,st:r.status}))}catch(e){}
if(!ok())return;const seen={};eds=eds.filter(e=>e.st!=='Bootleg'&&e.n).sort((x,y)=>(x.d||'9999').localeCompare(y.d||'9999')).filter(e=>{const k=e.t+'|'+e.dis+'|'+e.n;if(seen[k])return false;seen[k]=1;return true});
const loadRel=async relId=>{$('#trk').innerHTML=loading;let rel;try{rel=await mbc(`release/${relId}?inc=recordings+labels+artist-rels`,30*DAY)}catch(e){$('#trk').innerHTML='<div class="card muted">Elenco tracce non disponibile.</div>';return}if(!ok())return;
const ms=x=>x?`${Math.floor(x/60000)}:${String(Math.round(x/1000)%60).padStart(2,'0')}`:'';let tot=0;const media=rel.media||[];
$('#trk').innerHTML=media.map((m,mi)=>`${media.length>1?`<div class="dec">${esc(m.title||m.format||'Disco')} ${m.title?'':mi+1}</div>`:''}${(m.tracks||[]).map(t=>{tot+=t.length||0;return`<div class="trk"><span class="no">${esc(t.number)}</span><span class="tt">${esc(t.title)}</span><span class="du">${ms(t.length)}</span><button class="play" data-a="${esc(artist)}" data-t="${esc(t.title)}" onclick="playPrev(this)">${I.play}</button>${spBtn(artist,t.title)}</div>`}).join('')}`).join('');
const labels=[...new Set((rel['label-info']||[]).map(l=>l.label?.name).filter(Boolean))];const prod=[...new Set((rel.relations||[]).filter(r=>r.type==='producer').map(r=>r.artist?.name))];
const ntr=media.reduce((s,m)=>s+(m.tracks||[]).length,0);
$('#info').innerHTML=`<div class="stats" style="margin-top:22px"><div class="stat"><b>${rg['first-release-date']?fmtDate(rg['first-release-date']).replace(/ \d{4}$/,'')||'—':'—'}</b><span>uscita ${rg['first-release-date']?.slice(0,4)||''}</span></div><div class="stat"><b>${ntr}</b><span>tracce${media.length>1?` · ${media.length} dischi`:''}</span></div>${tot?`<div class="stat"><b>${Math.round(tot/60000)}′</b><span>durata totale</span></div>`:''}${labels.length?`<div class="stat"><b style="font-size:16px;line-height:1.3">${esc(labels.slice(0,2).join(', '))}</b><span>etichetta</span></div>`:''}${prod.length?`<div class="stat"><b style="font-size:16px;line-height:1.3">${esc(prod.slice(0,2).join(', '))}</b><span>produzione</span></div>`:''}<div class="stat"><b>${eds.length||rels.length}</b><span>edizioni pubblicate</span></div></div>`};
const mineRel=S.albums[rgid]?.rel;const cur=(mineRel&&eds.find(e=>e.id===mineRel))?mineRel:(eds[0]?.id||rels[0].id);
if(eds.length>1){const lab=e=>`${e.dis?e.dis.charAt(0).toUpperCase()+e.dis.slice(1):e.t}${e.d?' · '+e.d.slice(0,4):''}${e.c&&e.c!=='XW'?' · '+e.c:''} · ${e.n} brani${e.m>1?' ('+e.m+' dischi)':''}`;
$('#ed').innerHTML=`<div class="field" style="margin-bottom:6px"><label>Edizione${mineRel?' · <span style="color:var(--gold)">la tua</span>':''}</label><select id="edsel">${eds.map(e=>`<option value="${e.id}" ${e.id===cur?'selected':''}>${esc(lab(e))}</option>`).join('')}</select></div>`;
$('#edsel').onchange=e=>{setAlb(rgid,{rel:e.target.value},rg,artist,aid);loadRel(e.target.value);toast('Edizione salvata')}}
loadRel(cur)}
function setAlb(id,patch,rg,artist,aid){const cur=S.albums[id]||{t:rg.title,a:artist,aid,d:rg['first-release-date']||''};Object.assign(cur,patch);cur.u=Date.now();if(!cur.cd&&!cur.r&&!cur.n&&!cur.rel){delete S.albums[id];tomb('b:'+id)}else{S.albums[id]=cur;if(S.del)delete S.del['b:'+id]}save()}

/* ---------- RICERCA ---------- */
let sq='',sk='artist';
function vSearch(app){app.innerHTML=`<div class="top"><h1 style="font-size:30px">Cerca</h1></div>
<div class="sbox">${I.search}<input id="q" type="search" placeholder="Artisti, album, brani…" value="${esc(sq)}" autocomplete="off"></div>
<div class="tabs" id="sk">${[['artist','Artisti'],['release-group','Album'],['recording','Brani']].map(([k,l])=>`<button class="tab ${k===sk?'on':''}" data-k="${k}">${l}</button>`).join('')}</div><div id="res"></div>`;
const q=$('#q');let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{sq=q.value.trim();doSearch()},450)};
$('#sk').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{sk=b.dataset.k;$('#sk').querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));doSearch()});
if(!sq)setTimeout(()=>q.focus(),100);doSearch()}
let searchId=0;
async function doSearch(){const R=$('#res');if(!R)return;const id=++searchId;if(sq.length<2){R.innerHTML=`<div class="empty small">Cerca per nome dell'artista, titolo dell'album o del brano.<br>Tocca ☆ per aggiungere un artista ai preferiti.</div>`;return}
R.innerHTML=loading;try{const j=await mbc(`${sk}?query=${enc(sq)}&limit=${sk==='release-group'?60:25}`,DAY);if(id!==searchId)return;
if(sk==='artist'){const L=(j.artists||[]).filter(a=>a.score>=50);R.innerHTML=L.map(a=>`<div class="li"><a href="#artista/${a.id}" class="row" style="flex:1;min-width:0">${avatar(a.name,'th r')}<div class="tx"><b>${esc(a.name)}</b><span>${esc([a.type==='Group'?'Gruppo':a.type==='Person'?'Artista':'',a.area?.name||a.country,a.disambiguation,a['life-span']?.begin?.slice(0,4)].filter(Boolean).join(' · '))}</span></div></a><button class="iconbtn" style="color:var(--gold)" onclick="toggleFav('${a.id}',${esc(JSON.stringify(a.name))});this.innerHTML=S.artists['${a.id}']?I.starF:I.starO">${S.artists[a.id]?I.starF:I.starO}</button></div>`).join('')||'<div class="empty">Nessun risultato.</div>'}
else if(sk==='release-group'){const L=(j['release-groups']||[]).filter(r=>r.score>=60);const order=['Album','EP','Singolo','Live','Raccolta','Colonna sonora','Remix','Demo','Altro'];const G={};L.forEach(r=>(G[typeOf(r)]=G[typeOf(r)]||[]).push(r));
R.innerHTML=order.filter(k=>G[k]).map(k=>`<div class="dec">${tabName(k)} <span class="muted small">${G[k].length}</span></div>`+G[k].sort((a,b)=>(a['first-release-date']||'9999').localeCompare(b['first-release-date']||'9999')).map(r=>{const ar=(r['artist-credit']||[]).map(c=>c.name+(c.joinphrase||'')).join('');const y=(r['first-release-date']||'').slice(0,4);return`<a class="li" href="#album/${r.id}"><div class="th">${coverImg(r.id,ar,r.title)}</div><div class="tx"><b>${esc(r.title)}</b><span>${esc(ar)}</span></div><span style="font-family:var(--serif);font-size:18px;color:var(--gold)">${y||'—'}</span></a>`}).join('')).join('')||'<div class="empty">Nessun risultato.</div>'}
else{const L=j.recordings||[];R.innerHTML=L.map(r=>{const ar=(r['artist-credit']||[]).map(c=>c.name+(c.joinphrase||'')).join('');const rel=(r.releases||[]).find(x=>x['release-group']?.['primary-type']==='Album')||(r.releases||[])[0];const rgid=rel?.['release-group']?.id;
return`<div class="li">${rgid?`<a class="th" href="#album/${rgid}">${coverImg(rgid,ar,rel['release-group'].title||rel.title)}</a>`:`<div class="th">${phHTML(r.title)}</div>`}<div class="tx"><b>${esc(r.title)}</b><span>${esc(ar)}${rel?' · '+esc(rel.title):''}${r['first-release-date']?' · '+r['first-release-date'].slice(0,4):''}</span></div><button class="play" data-a="${esc(ar)}" data-t="${esc(r.title)}" onclick="playPrev(this)">${I.play}</button>${spBtn(ar,r.title)}</div>`}).join('')||'<div class="empty">Nessun risultato.</div>'}}
catch(e){if(id===searchId)R.innerHTML=`<div class="empty">Ricerca non riuscita (${esc(e.message)}). Riprova tra un attimo.</div>`}}

$('#ct').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ctab=b.dataset.k;vConcerts(app,_,ok)});const B=$('#cb');

if(!S.settings.tm){B.innerHTML=`<div class="card"><h3 style="font-size:19px">Attiva i concerti</h3><p class="small muted" style="line-height:1.5">I concerti arrivano da Ticketmaster. Serve una chiave gratuita: inseriscila nelle Impostazioni.</p><a class="btn sm" href="#impostazioni">Vai alle Impostazioni</a></div>`;return}

B.innerHTML=(ctab==='m'?`<p class="small muted" style="margin:10px 0 0">Chi dei tuoi artisti suona in Italia da oggi al ${fmtDate(lim)}.</p>`:'')+(html||`<div class="card muted small" style="margin-top:12px">Nessun concerto ${ctab==='m'?'in Italia nel prossimo mese':ctab==='it'?'in Italia':'all\'estero'} annunciato per i tuoi artisti.</div>`)+`<p class="small muted" style="margin-top:18px;line-height:1.5">Le date arrivano da Ticketmaster. Alcuni concerti italiani in vendita solo su TicketOne potrebbero mancare: dalla scheda dell'artista puoi cercarli anche lì.</p>`}
window.addDiary=function(id){const c=S.diary.find(x=>x.id===id)||{date:today(),artist:'',city:'',venue:'',note:''};
const s=sheet(`<h2 style="margin-bottom:14px">${id?'Modifica concerto':'Nuovo concerto visto'}</h2>
<div class="field"><label>Artista</label><input id="da" list="dal" value="${esc(c.artist)}"><datalist id="dal">${Object.values(S.artists).map(a=>`<option value="${esc(a.name)}">`).join('')}</datalist></div>
<div class="field"><label>Data</label><input id="dd" type="date" value="${esc(c.date)}"></div>

<div class="field"><label>Locale</label><input id="dv" value="${esc(c.venue)}"></div>

$('#dsave',s).onclick=()=>{const v={u:Date.now(),id:id||'c'+Date.now(),artist:$('#da',s).value.trim(),date:$('#dd',s).value,city:$('#dc',s).value.trim(),venue:$('#dv',s).value.trim(),note:$('#dn',s).value.trim()};if(!v.artist||!v.date)return toast('Servono artista e data');

if(id)$('#ddel',s).onclick=()=>{S.diary=S.diary.filter(x=>x.id!==id);tomb('c:'+id);save();s.remove();render()}};

const ghH=()=>({Authorization:'Bearer '+K.gh,Accept:'application/vnd.github+json'});
const ghU=()=>`https://api.github.com/repos/${K.ghUser}/${K.ghRepo}/contents/data.json`;
async function ghGet(){const r=await fetch(ghU()+'?t='+Date.now(),{headers:ghH(),cache:'no-store'});if(r.status===404)return{data:null,sha:null};if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();
const bin=atob(j.content.replace(/\n/g,''));const txt=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));return{data:JSON.parse(txt),sha:j.sha}}
async function ghPut(sha){const bytes=new TextEncoder().encode(JSON.stringify(S));let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));
const r=await fetch(ghU(),{method:'PUT',headers:ghH(),body:JSON.stringify({message:'OutLoud! sync',content:btoa(bin),...(sha?{sha}:{})})});if(!r.ok)throw new Error('GitHub '+r.status)}

if(w['2026']&&w.sempre&&!w['2026'].min){const k=x=>new Set((x.pl||[]).map(t=>norm(t.t)+norm(t.a)));const a=k(w['2026']),b=k(w.sempre);let c=0;a.forEach(x=>b.has(x)&&c++);if(a.size&&c/a.size>0.7){delete w['2026'];tomb('w:2026');save();return}}if(w['2026']&&w['2026'].plName&&!/(19|20)\d\d/.test(w['2026'].plName)&&!w['2026'].min){w.sempre=w['2026'];delete w['2026'];save()}}
function mergeState(L,R){if(!R)return L;const out=Object.assign(blank(),R,L);const del=Object.assign({},R.del||{},L.del||{});
for(const k in del){const o=(L.del||{})[k]||0,r=(R.del||{})[k]||0;del[k]=Math.max(o,r)}
const mm=(a,b,pre)=>{const o={};for(const k of new Set([...Object.keys(a||{}),...Object.keys(b||{})])){const x=(a||{})[k],y=(b||{})[k];const w=!x?y:!y?x:((x.u||0)>=(y.u||0)?x:y);if(del[pre+k]&&del[pre+k]>(w.u||w.addedAt||0))continue;o[k]=w}return o};
out.artists=mm(L.artists,R.artists,'a:');out.albums=mm(L.albums,R.albums,'b:');
const dm={};[...(R.diary||[]),...(L.diary||[])].forEach(c=>{const p=dm[c.id];if(!p||(c.u||0)>=(p.u||0))dm[c.id]=c});out.diary=Object.values(dm).filter(c=>!(del['c:'+c.id]&&del['c:'+c.id]>(c.u||0)));
out.seen=Object.assign({},R.seen||{},L.seen||{});for(const k in out.seen)if((R.seen||{})[k]==='old'||(L.seen||{})[k]==='old')out.seen[k]='old';
out.seenGigs=Object.assign({},R.seenGigs||{},L.seenGigs||{});out.wrapped=Object.assign({},R.wrapped||{},L.wrapped||{});for(const y in out.wrapped)if(del['w:'+y])delete out.wrapped[y];
out.prioDone=[...new Set([...(R.prioDone||[]),...(L.prioDone||[])])];
const sl=L.settings||{},sr=R.settings||{};out.settings={};for(const k of new Set([...Object.keys(sr),...Object.keys(sl)]))out.settings[k]=sl[k]||sr[k]||'';
out.lastCheck=Math.max(L.lastCheck||0,R.lastCheck||0);out.lastGigs=Math.max(L.lastGigs||0,R.lastGigs||0);out.del=del;out.updatedAt=Math.max(L.updatedAt||0,R.updatedAt||0);return out}

<div class="field"><label>Last.fm (API key)</label><input id="lf" value="${esc(S.settings.lf||'')}"></div><div class="field"><label>YouTube (chiave API di Google)</label><input id="yt" value="${esc(S.settings.yt||'')}"></div>
<button class="btn sm ghost" onclick="saveSet();toast('Salvato')">Salva</button></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Sincronizzazione</h3><p class="small muted" style="line-height:1.5">Come per Visto!: i dati restano nel repository privato su GitHub e si allineano tra iPhone, iPad e PC.</p>
<div class="field"><label>Utente GitHub</label><input id="ghu" value="${esc(K.ghUser)}"></div><div class="field"><label>Repository privato</label><input id="ghr" value="${esc(K.ghRepo)}"></div><div class="field"><label>Token</label><input id="ght" type="password" value="${esc(K.gh)}" placeholder="github_pat_…"></div>
<button class="btn sm" onclick="saveSet();doSync()">Salva e sincronizza</button></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Notifiche e aspetto</h3>
<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${!('PushManager'in window)?'<span class="pill">Apri OutLoud! dall\'icona sulla Home per le notifiche</span>':(perm==='granted'&&K.pushOn)?'<span class="pill">🔔 Attive anche ad app chiusa ✓</span> <button class="btn sm ghost" onclick="askNotif()">Riattiva</button>':'<button class="btn sm" onclick="askNotif()">🔔 Attiva le notifiche</button>'}</div><p class="small muted" style="line-height:1.5;margin:10px 0 0">Nuovi dischi, singoli e raccolte, e concerti in Italia: due controlli al giorno (verso le 8 e le 18), anche ad app chiusa. Per i gruppi prioritari una notifica per ogni uscita.</p><div class="row" style="gap:8px;flex-wrap:wrap;margin-top:12px">
<div class="tabs" style="margin:4px 0;flex-basis:100%">${[['dark','Sera'],['day','Giorno'],['auto','Automatico']].map(([k,l])=>`<button class="tab ${K.theme===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div><button class="btn sm ghost" onclick="checkNews(true);go('home')">Controlla novità ora</button></div></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Backup</h3><p class="small muted" style="line-height:1.5;margin:6px 0 0">Ogni notte GitHub salva una copia di tutti i tuoi dati (una sola, che si aggiorna). Se i dati sembrano svuotati, il backup non viene toccato.</p><div id="bkinfo" class="small" style="margin-top:8px;color:var(--gold)"></div>
<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap">${K.gh?'<button class="btn sm" onclick="restoreBackup()">Ripristina il backup</button>':''}<button class="btn sm ghost" onclick="exportData()">Esporta</button><label class="btn sm ghost">Importa<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></div>
<div class="sign">OutLoud! ${VER}<br>Stefano Fasolato 🖤💙</div></div>`;setTimeout(backupInfo,0)}
async function ghFile(name){const r=await fetch(`https://api.github.com/repos/${K.ghUser}/${K.ghRepo}/contents/${name}?t=${Date.now()}`,{headers:{Authorization:'Bearer '+K.gh,Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(!r.ok)return null;return JSON.parse(await r.text())}
async function backupInfo(){const e=$('#bkinfo');if(!e||!K.gh)return;try{const b=await ghFile('backup.json');if(!e.isConnected)return;e.textContent=b?`Ultimo backup: ${new Date(b.backupAt).toLocaleString('it-IT',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})} · ${Object.keys(b.artists||{}).length} artisti, ${Object.values(b.albums||{}).filter(v=>v.cd).length} CD`:'Il primo backup arriva stanotte'}catch(x){}}
window.restoreBackup=async function(){if(!confirm('Ripristino i dati dal backup notturno? Quello che hai cambiato dopo il backup andrà perso.'))return;
try{const b=await ghFile('backup.json');if(!b)return toast('Nessun backup trovato');delete b.backupAt;S=Object.assign(blank(),b);S.updatedAt=Date.now();S.del={};localStorage.setItem(LS,JSON.stringify(S));
const{sha}=await ghGet();await ghPut(sha);toast(`Ripristinati ${Object.keys(S.artists).length} artisti e ${Object.values(S.albums).filter(v=>v.cd).length} CD`);go('home');render()}catch(e){toast('Ripristino non riuscito: '+e.message)}};
window.saveSet=()=>{S.settings.lf=($('#lf')?.value||'').trim();S.settings.yt=($('#yt')?.value||'').trim();S.settings.sp=$('#sp').value.trim();S.settings.tm=$('#tm').value.trim();K.ghUser=$('#ghu').value.trim()||OWNER_DEFAULT;K.ghRepo=$('#ghr').value.trim()||'outloud-dati';K.gh=$('#ght').value.trim();saveKeys();save(false,false)};
window.doSync=async()=>{if(!K.gh)return toast('Inserisci il token');try{const r=await syncNow();toast(r==='pulled'?'Dati scaricati da GitHub':r==='pushed'?'Dati salvati su GitHub':'Già allineato')}catch(e){toast('Errore: '+e.message)}};
const VAPID='BP94QoFVHO0nUnKtTUGKI0nVdN95HYz9xjON5Cs-rGJEqscO7TQ32umJ4hRK_hClpVincDoO3zmeFq34pRWehJk';
const devName=()=>/iPad/.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Macintosh/.test(navigator.userAgent))?'iPad':/iPhone/.test(navigator.userAgent)?'iPhone':'computer';
const b64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
window.askNotif=async()=>{try{
if(!('serviceWorker'in navigator)||!('PushManager'in window))return toast("Apri OutLoud! dall'icona sulla Home");
if(!K.gh)return toast('Prima attiva la sincronizzazione qui sotto');
const p=await Notification.requestPermission();if(p!=='granted')return toast('Permesso non concesso');
const reg=await navigator.serviceWorker.ready;const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
K.devId=K.devId||devName().toLowerCase()+'-'+Math.random().toString(36).slice(2,8);saveKeys();
const url=`https://api.github.com/repos/${K.ghUser}/${K.ghRepo}/contents/push.json`;let sha,cur={subs:{}};
const g=await fetch(url+'?t='+Date.now(),{headers:ghH(),cache:'no-store'});if(g.ok){const j=await g.json();sha=j.sha;try{cur=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),c=>c.charCodeAt(0))))}catch(e){}}
cur.subs=cur.subs||{};cur.subs[K.devId]={name:devName(),at:Date.now(),sub:sub.toJSON()};
const r=await fetch(url,{method:'PUT',headers:ghH(),body:JSON.stringify({message:'OutLoud!: notifiche attivate su '+devName(),content:btoa(unescape(encodeURIComponent(JSON.stringify(cur,null,1)))),...(sha?{sha}:{})})});
if(!r.ok)throw new Error('GitHub '+r.status);K.pushOn=1;saveKeys();render();toast('🔔 Attivate! Tra qualche minuto arriva la notifica di benvenuto')}catch(e){toast('Non riesco ad attivarle: '+e.message)}};
window.setTheme=t=>{K.theme=t;saveKeys();applyTheme();render()};
const mqDark=matchMedia('(prefers-color-scheme: dark)');mqDark.addEventListener?.('change',()=>{if(K.theme==='auto')applyTheme()});
function isDay(){return K.theme==='day'||(K.theme==='auto'&&!mqDark.matches)}
function applyTheme(){document.body.classList.toggle('day',isDay());document.querySelector('meta[name=theme-color]').content=isDay()?'#f5f0e6':'#0a0a0d'}
window.exportData=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='outloud-backup.json';a.click()};
window.importData=async inp=>{try{const d=JSON.parse(await inp.files[0].text());S=Object.assign(blank(),d);save();toast('Backup ripristinato');render()}catch(e){toast('File non valido')}};
window.checkNews=checkNews;window.go=go;window.I=I;

/* ---------- INTRO ---------- */
function eqHTML(n,cls=''){return `<div class="eq ${cls}">${Array.from({length:n},(_,i)=>`<b style="animation-delay:${(-(i*137)%900)}ms;animation-duration:${700+((i*53)%500)}ms"></b>`).join('')}</div>`}
function introCovers(){const seen=new Set(),out=[];const key=u=>{const m=String(u).match(/release-group\/([0-9a-f-]{36})/);return m?'rg:'+m[1]:u.replace(/\/\d+x\d+-[^/]*$/,'').replace(/[?#].*$/,'')};
const add=u=>{if(!u||u==='-')return;const k=key(u);if(seen.has(k))return;seen.add(k);out.push(u)};
Object.entries(S.albums).filter(([,v])=>v.cd).forEach(([id])=>{if(covMap[id]==='-')return;seen.has('rg:'+id)||(seen.add('rg:'+id),out.push(covMap[id]||caa(id,250)))});
wallL.forEach(add);return out.sort(()=>Math.random()-.5)}
function intro(){const el=$('#intro');let done=false;const hide=()=>{if(done)return;done=true;el.classList.add('hide');setTimeout(()=>el.style.display='none',1000)};
if(sessionStorage.getItem('ol-intro')){el.style.display='none';return}sessionStorage.setItem('ol-intro',1);
$('#ienter').onclick=hide;
$('#ilogo').innerHTML=[...'Loud!'].map((c,i)=>`<span style="animation-delay:${150+i*110}ms">${c}</span>`).join('');
$('#ieq').outerHTML=eqHTML(22);
const na=Object.keys(S.artists).length,nc=Object.values(S.albums).filter(v=>v.cd).length,nn=Object.values(S.seen||{}).filter(v=>v==='new').length;
$('#istats').textContent=na||nc?`${na} artisti · ${nc} CD${nn?' · '+nn+' novità':''}`:'';
const urls=introCovers();
if(urls.length){const rows=5,per=Math.max(innerWidth>800?16:10,Math.min(18,Math.floor(urls.length/rows)));let html='';for(let r=0;r<rows;r++){const seg=[];for(let i=0;i<per;i++)seg.push(urls[(r*per+i)%urls.length]);const imgs=seg.map(u=>`<img src="${esc(u)}" decoding="async" style="opacity:0;transition:opacity .5s" onload="this.style.opacity=1" onerror="this.style.visibility='hidden'" alt="">`).join('');html+=`<div class="wrow ${r%2?'rev':''}" style="animation-duration:${60+r*12}s">${imgs}${imgs}</div>`}
$('#wall').innerHTML=html;$('#wall').classList.add('on')}}

/* ---------- avvio ---------- */
applyTheme();try{fixWrapped()}catch(e){}intro();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{await spCallback();if(K.gh){try{await syncNow()}catch(e){}}setTimeout(async()=>{await initPrio();await checkNews();checkGigs()},1500)})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(K.gh)syncNow().catch(()=>{});checkNews()}});
</script>
</body>
</html>
