<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OutLoud!</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OutLoud!">
<meta name="theme-color" content="#0a0a0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0d;--bg2:#121217;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--tx:#f4efe4;--mu:#9b968b;--gold:#d6b36a;--gold2:#f2dca4;--red:#e46a6a;--glass:rgba(22,21,27,.58);--shadow:0 18px 40px rgba(0,0,0,.45);--serif:'Fraunces',Georgia,serif;--sans:'Inter',-apple-system,system-ui,sans-serif}
body.day{--bg:#f5f0e6;--bg2:#ece5d6;--card:rgba(0,0,0,.035);--card2:rgba(0,0,0,.07);--line:rgba(0,0,0,.09);--tx:#1d1b17;--mu:#6f695e;--gold:#a6802f;--gold2:#7d5e1c;--glass:rgba(250,246,238,.62);--shadow:0 14px 30px rgba(60,45,20,.15)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:var(--bg)}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:420px;pointer-events:none;z-index:-1;background:radial-gradient(ellipse 90% 100% at 50% -40%,rgba(214,179,106,.14),transparent 70%)}
html,body{overflow-x:hidden;max-width:100%}
body.day:before{background:radial-gradient(ellipse 90% 100% at 50% -40%,rgba(214,179,106,.25),transparent 70%)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;outline:none}
input:focus,textarea:focus{border-color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
#app{max-width:1100px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 110px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:block}
.sub{color:var(--mu);font-size:13px;margin-top:2px;text-transform:capitalize}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.iconbtn svg{width:19px;height:19px}
.sec{margin:26px 0 12px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec h2{font-size:22px}
.sec .more{color:var(--gold);font-size:13px;font-weight:600}
.muted{color:var(--mu)}
.small{font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.hscroll{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;background:linear-gradient(120deg,var(--gold2),var(--gold));color:#1a150c;font-weight:600;font-size:14px}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn svg{width:16px;height:16px;flex:none}
.chip{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--card2);font-size:12px;color:var(--mu);margin:0 6px 6px 0}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#1a150c}
.badge.out{background:var(--card2);color:var(--gold)}
/* covers */
.cov{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--bg2);box-shadow:var(--shadow)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:grid;place-items:center;font-family:var(--serif);font-size:26px;color:rgba(255,255,255,.85);text-align:center;padding:8px}
.ph small{display:block;font-family:var(--sans);font-size:10px;opacity:.7;margin-top:4px}
/* news */
.news{width:min(72vw,260px)}
.news .t{font-family:var(--serif);font-size:17px;margin-top:10px;line-height:1.2}
.news .a{color:var(--mu);font-size:13px;margin-top:3px}
.news .m{margin-top:7px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.news .cov .badge{position:absolute;top:10px;left:10px}
/* artists */
.av{width:84px;text-align:center}
.av .pic{width:84px;height:84px;border-radius:50%;overflow:hidden;background:var(--bg2);border:2px solid var(--line);box-shadow:var(--shadow)}
.av .pic img{width:100%;height:100%;object-fit:cover}
.av .n{font-size:12.5px;margin-top:7px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:18px 14px}
.grid.alb{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.alb .t{font-size:13.5px;font-weight:600;margin-top:8px;line-height:1.25}
.alb .y{font-size:12px;color:var(--mu);margin-top:2px}
.dec{font-family:var(--serif);font-size:15px;color:var(--gold);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.dec:after{content:"";flex:1;height:1px;background:var(--line)}
/* hero */
.hero{position:relative;margin:calc(-14px - env(safe-area-inset-top)) -18px 0;padding:calc(env(safe-area-inset-top) + 64px) 18px 22px;overflow:hidden;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .bgi{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:saturate(1.05)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,13,.15),rgba(10,10,13,.55) 55%,var(--bg))}
body.day .hero:after{background:linear-gradient(180deg,rgba(245,240,230,.05),rgba(245,240,230,.6) 60%,var(--bg))}
.hero>*:not(.bgi){position:relative;z-index:1}
.hero h1{font-size:38px;line-height:1.05}
.back{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;z-index:30;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.star{position:absolute;right:18px;bottom:24px;z-index:2}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 15px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--mu);background:var(--card);border:1px solid var(--line);white-space:nowrap}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:24px;color:var(--gold)}
.stat span{font-size:12px;color:var(--mu)}
/* timeline */
.tl{position:relative}
.tlr{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.tlr .nm{font-size:13px;font-weight:600;line-height:1.2}
.tlr .nm small{display:block;font-weight:400;color:var(--mu);font-size:11px;margin-top:2px}
.bar{position:relative;height:12px;border-radius:6px;background:var(--card)}
.seg{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--mu);opacity:.55}
.seg.now{background:linear-gradient(90deg,var(--gold),var(--gold2));opacity:1}
.axis{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:10.5px;color:var(--mu);margin-top:6px}
.axis div{position:relative;height:14px}
.axis span{position:absolute;transform:translateX(-50%)}
/* tracks */
.trk{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line)}
.trk .no{width:22px;text-align:right;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.trk .tt{flex:1;font-size:14.5px}
.trk .du{color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums}
.play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--card2)}
.play svg{width:12px;height:12px}
.play.on{background:var(--gold);color:#1a150c}
.stars{display:flex;gap:6px}
.stars button{font-size:28px;color:var(--line);line-height:1}
.stars button.on{color:var(--gold)}
/* list rows */
.li{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)}
.li .th{width:54px;height:54px;flex:none;border-radius:8px;overflow:hidden;background:var(--bg2)}
.li .th.r{border-radius:50%}
.li .th img{width:100%;height:100%;object-fit:cover}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .tx span{font-size:12.5px;color:var(--mu)}
.date{width:54px;height:58px;flex:none;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.date b{font-family:var(--serif);font-size:22px}
.date span{font-size:10.5px;text-transform:uppercase;color:var(--gold);margin-top:3px;font-weight:700}
/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:18px 12px}
.jewel{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;box-shadow:var(--shadow);background:var(--bg2)}
.jewel img{width:100%;height:100%;object-fit:cover}
.jewel:before{content:"";position:absolute;left:0;top:0;bottom:0;width:9%;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(255,255,255,.12));z-index:1}
.jewel:after{content:"";position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.28),transparent 35%,transparent 70%,rgba(255,255,255,.08));z-index:1}
/* indice alfabetico */
.azidx{position:fixed;right:2px;top:50%;transform:translateY(-50%);z-index:35;display:flex;flex-direction:column;align-items:center;padding:6px 3px;border-radius:12px;touch-action:none;user-select:none;-webkit-user-select:none}
.azidx b{font-size:10.5px;line-height:1.38;font-weight:700;color:var(--gold);width:18px;text-align:center}
.azidx b.off{color:var(--mu);opacity:.35}
.azbig{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:70;width:86px;height:86px;border-radius:22px;display:grid;place-items:center;font-family:var(--serif);font-size:48px;color:var(--gold);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);pointer-events:none;opacity:0;transition:opacity .15s}
.azbig.on{opacity:1}
/* nav */
nav.bn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:40;display:flex;gap:2px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.35);width:min(94vw,480px)}
nav.bn a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;border-radius:20px;font-size:10.5px;color:var(--mu);font-weight:600}
nav.bn a svg{width:22px;height:22px}
nav.bn a.on{color:var(--gold);background:var(--card2)}
/* search */
.sbox{position:relative}
.sbox input{padding-left:42px;border-radius:16px;font-size:16px;height:50px}
.sbox svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--mu)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet .in{background:var(--bg2);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);z-index:70;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);transition:opacity .3s}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mu);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:999px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--gold);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.load{display:flex;justify-content:center;padding:40px}
.load .spin{width:26px;height:26px}
.empty{text-align:center;padding:30px 16px;color:var(--mu)}
.empty h3{color:var(--tx);margin-bottom:8px;font-size:20px}
.bio p{line-height:1.6;margin:0 0 12px;font-size:14.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12.5px;color:var(--mu);margin-bottom:6px}
.sign{text-align:center;color:var(--mu);font-size:12.5px;margin:40px 0 10px}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.chk.on{background:var(--gold);border-color:var(--gold);color:#1a150c}
.ann{border-left:3px solid var(--gold);padding-left:12px}
/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#060608;overflow:hidden;transition:opacity .9s ease,visibility .9s;display:grid;place-items:center}
#intro.hide{opacity:0;visibility:hidden}
.wall{position:absolute;left:50%;top:50%;width:190vmax;min-height:120vmax;justify-content:center;transform:translate(-50%,-50%) perspective(1000px) rotateX(22deg) rotateZ(-9deg);display:flex;flex-direction:column;gap:14px;opacity:0;transition:opacity 1.4s ease}
.wall.on{opacity:1}
.wrow{display:flex;gap:14px;width:max-content;animation:slide linear infinite}
.wrow.rev{animation-direction:reverse}
.wrow img{width:min(23vmin,170px);aspect-ratio:1;object-fit:cover;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.6);filter:saturate(.85) brightness(.8)}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.beams{position:absolute;inset:-30%;pointer-events:none;mix-blend-mode:screen}
.beams i{position:absolute;top:-10%;width:60%;height:140%;background:conic-gradient(from 180deg at 50% 0,transparent 0 172deg,rgba(242,220,164,.22) 180deg,transparent 188deg);transform-origin:50% 0;animation:sweep 6s ease-in-out infinite alternate}
.beams i:nth-child(1){left:5%}.beams i:nth-child(2){right:5%;animation-delay:-3s;animation-duration:7s}
@keyframes sweep{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
#intro .vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(6,6,8,.3) 0,rgba(6,6,8,.68) 45%,#060608 88%)}
#intro .ctr{position:relative;text-align:center;padding:0 20px}
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:.9}
.lo-out{font-family:var(--sans);font-weight:700;letter-spacing:.62em;font-size:13px;color:var(--gold2);margin:0 0 2px 6px}
.lo-loud{font-family:var(--serif);font-style:italic;font-weight:700;font-size:44px;letter-spacing:-.02em;background:linear-gradient(100deg,#9c7a3c 0%,#f6e2ad 22%,#d6b36a 40%,#fff4d6 50%,#d6b36a 60%,#9c7a3c 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;padding-right:6px}
body.day .lo-loud{background-image:linear-gradient(100deg,#6b4f17 0%,#b88a2e 30%,#e0b65a 50%,#b88a2e 70%,#6b4f17 100%)}
@keyframes shine{from{background-position:100% 0}to{background-position:-150% 0}}
#intro .lo-out{font-size:clamp(14px,3.6vw,20px);opacity:0;animation:fadeup .9s .5s forwards}
#intro .lo-loud{font-size:clamp(78px,22vw,150px);display:flex}
#intro .lo-loud span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(18px) scale(1.08);animation:letter 1s cubic-bezier(.2,.8,.2,1) forwards,shine 6s linear infinite;background:inherit;background-size:250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eq{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:34px;margin:18px auto 0}
.eq b{width:5px;border-radius:3px;background:linear-gradient(to top,#9c7a3c,#f2dca4);height:20%;animation:bar .9s ease-in-out infinite alternate}
@keyframes bar{0%{height:12%}100%{height:100%}}
#intro .eq{opacity:0;animation:fadeup .8s 1.2s forwards}
#intro p{color:#b5ad9d;letter-spacing:.38em;text-transform:uppercase;font-size:11px;margin-top:18px;opacity:0;animation:fadeup .9s 1.5s forwards}
#intro .skip{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 26px);left:0;right:0;text-align:center;color:#6f6a60;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:0;animation:fadeup .8s 2.2s forwards}
.brandrow{display:flex;align-items:flex-end;gap:10px}
.eq.mini{height:22px;gap:3px;margin:0 0 6px}.eq.mini b{width:3.5px}
@media(min-width:800px){.hero{border-radius:0 0 28px 28px}.news{width:250px}.hero h1{font-size:48px}}
</style>
</head>
<body>
<div id="intro"><div class="wall" id="wall"></div><div class="beams"><i></i><i></i></div><div class="vig"></div>
<div class="ctr"><div class="logo"><span class="lo-out">OUT</span><span class="lo-loud" id="ilogo"></span></div><div class="eq" id="ieq"></div><p>la tua musica, ad alta voce</p></div><div class="skip">tocca per entrare</div></div>
<div id="app"></div>
<nav class="bn" id="nav"></nav>
<script>
'use strict';
const VER='1.10';
const OWNER_DEFAULT='stich130476';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=encodeURIComponent;
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^the\s+/,'').replace(/[^a-z0-9]/g,'');
const DAY=864e5;
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const MES3=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];

/* ---------- icons ---------- */
const I={
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',

/* ---------- state ---------- */
const LS='outloud-data',LK='outloud-keys';
function blank(){return{v:1,updatedAt:0,artists:{},albums:{},seen:{},diary:[],wrapped:{},settings:{sp:'',tm:''},lastCheck:0}}
let S;try{S=Object.assign(blank(),JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){S=blank()}
let K;try{K=Object.assign({gh:'',ghUser:OWNER_DEFAULT,ghRepo:'outloud-dati',theme:'dark'},JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){K={gh:'',ghUser:OWNER_DEFAULT,ghRepo:'outloud-dati',theme:'dark'}}
function saveKeys(){localStorage.setItem(LK,JSON.stringify(K))}
let pushT;
function save(sync=true,bump=true){if(bump)S.updatedAt=Date.now();localStorage.setItem(LS,JSON.stringify(S));if(sync&&K.gh){clearTimeout(pushT);pushT=setTimeout(()=>syncNow(true).catch(()=>{}),2500)}}

/* ---------- cache (IndexedDB) ---------- */
const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('outloud',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
return{async get(k){try{const d=await db();return await new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}},
async set(k,v){try{const d=await db();await new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r;t.onerror=r})}catch(e){}}}})();
async function cached(key,ttl,fn){const c=await idb.get(key);if(c&&Date.now()-c.t<ttl)return c.v;try{const v=await fn();await idb.set(key,{t:Date.now(),v});return v}catch(e){if(c)return c.v;throw e}}

/* ---------- MusicBrainz (1 req/s, con priorità) ---------- */
const mbQ=[];let mbBusy=false,mbLast=0;
const mbUrl=p=>'https://musicbrainz.org/ws/2/'+p+(p.includes('?')?'&':'?')+'fmt=json';
function mb(path,hi=true){return new Promise((res,rej)=>{const t={path,res,rej};hi?mbQ.unshift(t):mbQ.push(t);pump()})}
async function pump(){if(mbBusy)return;mbBusy=true;while(mbQ.length){const t=mbQ.shift();const w=mbLast+1050-Date.now();if(w>0)await sleep(w);mbLast=Date.now();
try{let r=await fetch(mbUrl(t.path));if(r.status===503||r.status===429){await sleep(1600);mbLast=Date.now();r=await fetch(mbUrl(t.path))}if(!r.ok)throw new Error('MusicBrainz '+r.status);t.res(await r.json())}catch(e){t.rej(e)}}mbBusy=false}
const mbc=(path,ttl=7*DAY,hi=true)=>cached('mb:'+path,ttl,()=>mb(path,hi));

/* ---------- Deezer (JSONP): foto artisti, copertine di riserva, anteprime ---------- */
let dzN=0;
function dz(path){return new Promise((res,rej)=>{const cb='__dz'+(++dzN);const s=document.createElement('script');const to=setTimeout(()=>{clean();rej(new Error('timeout'))},9000);
function clean(){clearTimeout(to);delete window[cb];s.remove()}window[cb]=d=>{clean();res(d)};s.onerror=()=>{clean();rej(new Error('deezer'))};
s.src='https://api.deezer.com/'+path+(path.includes('?')?'&':'?')+'output=jsonp&callback='+cb;document.head.appendChild(s)})}
const photoMem={};
function artistPhoto(name){if(!name)return Promise.resolve('');if(photoMem[name])return photoMem[name];
return photoMem[name]=cached('dzp:'+name,30*DAY,async()=>{const d=await dz('search/artist?limit=6&q='+enc(name));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.name)===norm(name))||L[0];const u=m&&m.picture_xl;return u&&!/\/artist\/\//.test(u)?u:''}).catch(()=>'')}
function dzCover(artist,title){return cached('dzc:'+artist+'|'+title,30*DAY,async()=>{const d=await dz('search/album?limit=5&q='+enc(`artist:"${artist}" album:"${title}"`));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.title)===norm(title))||L[0];return (m&&m.cover_xl)||''}).catch(()=>'')}
function dzPreview(artist,title){return cached('dzt:'+artist+'|'+title,30*DAY,async()=>{const d=await dz('search/track?limit=5&q='+enc(`artist:"${artist}" track:"${title}"`));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.title)===norm(title))||L[0];return (m&&m.preview)||''}).catch(()=>'')}

/* ---------- copertine ---------- */
function hue(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h}
function phHTML(title,sub){const h=hue(title);const ini=String(title||'?').replace(/[^\p{L}\p{N} ]/gu,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'♪';
return `<div class="ph" style="background:linear-gradient(135deg,hsl(${h},35%,28%),hsl(${(h+50)%360},40%,14%))"><div>${esc(ini)}${sub?`<small>${esc(sub)}</small>`:''}</div></div>`}
function caa(id,sz=250){return `https://coverartarchive.org/release-group/${id}/front-${sz}`}
function coverImg(id,artist,title,sz=250){return `<img loading="lazy" src="${caa(id,sz)}" data-a="${esc(artist)}" data-t="${esc(title)}" onerror="coverFail(this)" onload="wallAdd(this)" alt="">`}
let wallT,wallL;try{wallL=JSON.parse(localStorage.getItem('ol-wall')||'[]')}catch(e){wallL=[]}
window.wallAdd=function(el){const u=el.currentSrc||el.src;if(!u||u.startsWith('data:')||wallL.includes(u))return;wallL.unshift(u);if(wallL.length>140)wallL.length=140;clearTimeout(wallT);wallT=setTimeout(()=>{try{localStorage.setItem('ol-wall',JSON.stringify(wallL))}catch(e){}},1500)};
window.coverFail=async function(el){if(el.dataset.tried){el.outerHTML=phHTML(el.dataset.t,el.dataset.a);return}el.dataset.tried=1;const u=await dzCover(el.dataset.a,el.dataset.t);if(u)el.src=u;else el.outerHTML=phHTML(el.dataset.t,el.dataset.a)};
function avatar(name,cls='pic'){const id='p'+Math.random().toString(36).slice(2);artistPhoto(name).then(u=>{const e=document.getElementById(id);if(e)e.innerHTML=u?`<img src="${u}" alt="" loading="lazy" onload="wallAdd(this)">`:phHTML(name)});return `<div class="${cls}" id="${id}">${phHTML(name)}</div>`}

/* ---------- date ---------- */
function fmtDate(d){if(!d)return'data ignota';const p=d.split('-');if(p.length===1)return p[0];if(p.length===2)return MESI[+p[1]-1]+' '+p[0];return (+p[2])+' '+MESI[+p[1]-1]+' '+p[0]}
const today=()=>new Date().toISOString().slice(0,10);
function daysTo(d){if(!d||d.length<10)return null;return Math.round((new Date(d+'T00:00:00')-new Date(today()+'T00:00:00'))/DAY)}
function whenBadge(d){const n=daysTo(d);if(n===null)return'';if(n>1)return`<span class="badge out">tra ${n} giorni</span>`;if(n===1)return'<span class="badge out">domani</span>';if(n===0)return'<span class="badge">esce oggi</span>';return''}
function typeOf(rg){const p=rg['primary-type']||rg.p||'';const s=rg['secondary-types']||rg.s||[];if(s.includes('Compilation'))return'Raccolta';if(s.includes('Live'))return'Live';if(s.includes('Soundtrack'))return'Colonna sonora';if(s.includes('Remix'))return'Remix';if(s.includes('Demo'))return'Demo';return({Album:'Album',Single:'Singolo',EP:'EP'})[p]||'Altro'}

/* ---------- discografia ---------- */
async function discography(mbid,hi=true,fresh=false){const key='disc:'+mbid;
if(!fresh){const c=await idb.get(key);if(c&&Date.now()-c.t<5*DAY)return c.v}
let out=[],off=0,tot=1;while(off<tot&&off<400){const j=await mb(`release-group?artist=${mbid}&limit=100&offset=${off}`,hi);tot=j['release-group-count']||0;
for(const r of j['release-groups']||[])out.push({id:r.id,t:r.title,d:r['first-release-date']||'',p:r['primary-type']||'',s:r['secondary-types']||[]});off+=100}
await idb.set(key,{t:Date.now(),v:out});return out}

/* ---------- controllo novità ---------- */
let checking=null;
async function checkNews(force=false){if(checking)return checking;const ids=Object.keys(S.artists);if(!ids.length)return;
if(!force&&Date.now()-S.lastCheck<6*3600e3)return;
checking=(async()=>{const fresh=[];let i=0;const cutoff=new Date(Date.now()-75*DAY).toISOString().slice(0,10);
for(const id of ids){i++;setProgress(`Controllo novità ${i}/${ids.length}…`);const a=S.artists[id];
try{const disc=await discography(id,false,true);for(const r of disc){if(r.d&&r.d>=cutoff){const k=r.id;if(!S.seen[k]){if(a.checked)fresh.push({...r,artist:a.name,aid:id});S.seen[k]=a.checked?'new':'old'}}}a.checked=1}catch(e){}}
S.lastCheck=Date.now();save();setProgress('');
if(fresh.length)notify(fresh.length===1?`Novità da ${fresh[0].artist}`:`${fresh.length} novità dai tuoi artisti`,fresh.slice(0,3).map(f=>`${f.artist} – ${f.t}`).join('\n'));
if(route().v==='home')render()})();try{await checking}finally{checking=null}}
async function newsList(){const cutoff=new Date(Date.now()-75*DAY).toISOString().slice(0,10);const out=[];
for(const id of Object.keys(S.artists)){const c=await idb.get('disc:'+id);if(!c)continue;for(const r of c.v)if(r.d&&r.d>=cutoff)out.push({...r,artist:S.artists[id].name,aid:id})}
return out.sort((a,b)=>b.d.localeCompare(a.d))}
async function onThisDay(){const md=today().slice(5),y=+today().slice(0,4),out=[];
for(const id of Object.keys(S.artists)){const c=await idb.get('disc:'+id);if(!c)continue;for(const r of c.v){const ty=typeOf(r);if((ty==='Album'||ty==='EP')&&r.d.length===10&&r.d.slice(5)===md&&+r.d.slice(0,4)<y)out.push({...r,artist:S.artists[id].name,aid:id,yrs:y-+r.d.slice(0,4)})}}
return out.sort((a,b)=>b.yrs-a.yrs)}
async function notify(title,body){try{if(!('Notification'in window)||Notification.permission!=='granted')return;const reg=await navigator.serviceWorker?.getRegistration();if(reg)reg.showNotification(title,{body,icon:'icon-192.png',badge:'icon-192.png'});else new Notification(title,{body})}catch(e){}}

/* ---------- concerti (Ticketmaster) ---------- */
async function concertsFor(name){if(!S.settings.tm)return[];
return cached('tm:'+name,12*3600e3,async()=>{const r=await fetch(`https://app.ticketmaster.com/discovery/v2/events.json?apikey=${enc(S.settings.tm)}&keyword=${enc(name)}&classificationName=music&size=60&sort=date,asc`);
if(!r.ok)throw new Error('Ticketmaster '+r.status);const j=await r.json();
return((j._embedded&&j._embedded.events)||[]).filter(e=>((e._embedded&&e._embedded.attractions)||[]).some(a=>norm(a.name)===norm(name))).map(e=>{const v=(e._embedded.venues||[])[0]||{};
return{id:e.id,name:e.name,date:e.dates?.start?.localDate||'',time:(e.dates?.start?.localTime||'').slice(0,5),venue:v.name||'',city:v.city?.name||'',cc:v.country?.countryCode||'',country:v.country?.name||'',url:e.url,artist:name}})}).catch(()=>[])}
async function allConcerts(){const out=[];for(const a of Object.values(S.artists)){out.push(...await concertsFor(a.name))}const seen=new Set();return out.filter(c=>!seen.has(c.id)&&seen.add(c.id)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}

/* ---------- Wikipedia / Wikidata ---------- */
async function wikiInfo(qid){return cached('wd:'+qid,30*DAY,async()=>{const j=await (await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${qid}&props=sitelinks|claims&format=json&origin=*`)).json();
const e=j.entities[qid];const sl=e.sitelinks||{};const lang=sl.itwiki?'it':(sl.enwiki?'en':'');const title=lang?sl[lang+'wiki'].title:'';
const img=e.claims?.P18?.[0]?.mainsnak?.datavalue?.value||'';let text='';
if(title){const w=await (await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&format=json&origin=*&titles=${enc(title)}`)).json();const pg=Object.values(w.query.pages)[0];text=pg.extract||''}
return{lang,title,img:img?`https://commons.wikimedia.org/wiki/Special:FilePath/${enc(img)}?width=1000`:'',text}})}

function topTracks(name){return cached('dztop:'+name,7*DAY,async()=>{const d=await dz('search/artist?limit=6&q='+enc(name));const L=(d&&d.data)||[];const m=L.find(a=>norm(a.name)===norm(name))||L[0];if(!m)return[];
const t=await dz(`artist/${m.id}/top?limit=20`);return((t&&t.data)||[]).map(x=>({t:x.title_short||x.title,album:x.album?.title||'',cover:x.album?.cover_medium||'',prev:x.preview||'',dur:x.duration?`${Math.floor(x.duration/60)}:${String(x.duration%60).padStart(2,'0')}`:''}))}).catch(()=>[])}
function spBtn(a,t){return `<a class="play" style="background:rgba(30,215,96,.15);color:#1ed760" target="_blank" href="https://open.spotify.com/search/${enc((t+' '+a).replace(/\s*\(.*?\)\s*/g,' ').trim())}" title="Apri su Spotify"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm4.6 14.4a.6.6 0 0 1-.9.2c-2.4-1.5-5.4-1.8-9-1a.6.6 0 1 1-.3-1.2c3.9-.9 7.2-.5 9.9 1.1.3.2.4.6.3.9zm1.2-2.7a.8.8 0 0 1-1.1.3c-2.7-1.7-6.9-2.2-10.2-1.2a.8.8 0 0 1-.5-1.5c3.7-1.1 8.3-.6 11.4 1.3.4.2.5.7.4 1.1zm.1-2.8C14.7 9 9.4 8.8 6.3 9.7a.9.9 0 1 1-.5-1.8c3.5-1.1 9.4-.9 13.1 1.3a.9.9 0 0 1-1 1.7z"/></svg></a>`}
/* ---------- audio ---------- */
const audio=new Audio();let playingBtn=null;
audio.onended=()=>{if(playingBtn){playingBtn.classList.remove('on');playingBtn.innerHTML=I.play}playingBtn=null};
window.playPrev=async function(btn){if(playingBtn===btn){audio.pause();btn.classList.remove('on');btn.innerHTML=I.play;playingBtn=null;return}
if(playingBtn){playingBtn.classList.remove('on');playingBtn.innerHTML=I.play}playingBtn=btn;btn.innerHTML='<div class="spin"></div>';
const u=btn.dataset.u||await dzPreview(btn.dataset.a,btn.dataset.t);if(playingBtn!==btn)return;if(!u){btn.innerHTML=I.play;playingBtn=null;toast('Anteprima non disponibile');return}
audio.src=u;audio.play().catch(()=>{});btn.classList.add('on');btn.innerHTML=I.pause};

/* ---------- UI helpers ---------- */
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},2200)}
let progressTxt='';function setProgress(t){progressTxt=t;const e=$('#prog');if(e)e.innerHTML=t?`<span class="pill"><span class="spin"></span>${esc(t)}</span>`:''}
function sheet(html){const s=document.createElement('div');s.className='sheet';s.innerHTML=`<div class="in">${html}</div>`;s.onclick=e=>{if(e.target===s)s.remove()};document.body.appendChild(s);return s}
const loading='<div class="load"><div class="spin"></div></div>';

const views={home:vHome,cerca:vSearch,artisti:vArtists,artista:vArtist,album:vAlbum,concerti:vConcerts,collezione:vCollection,impostazioni:vSettings};

/* ---------- HOME ---------- */
async function vHome(app,_,ok){const d=new Date();const dstr=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});
const n=Object.keys(S.artists).length;
app.innerHTML=`<div class="top"><div><div class="brandrow"><div class="logo brand"><span class="lo-out">OUT</span><span class="lo-loud">Loud!</span></div>${eqHTML(4,"mini")}</div><div class="sub">${esc(dstr)}</div></div><div class="row"><button class="iconbtn" onclick="checkNews(true)" title="Aggiorna">${I.refresh}</button><a class="iconbtn" href="#impostazioni">${I.gear}</a></div></div><div id="prog"></div>
${n?`<div id="hn">${loading}</div>`:`<div class="card empty" style="margin-top:20px"><h3>Benvenuto in OutLoud!</h3><p>Aggiungi i tuoi artisti per ricevere nuove uscite, concerti e discografie complete.</p><div class="row" style="justify-content:center;flex-wrap:wrap;gap:10px;margin-top:16px"><button class="btn" onclick="spLogin()">Importa da Spotify</button><a class="btn ghost" href="#cerca">Cerca un artista</a></div></div>`}
<div class="sign">OutLoud! ${VER} · Stefano Fasolato 🖤💙</div>`;
setProgress(progressTxt);if(!n)return;
const news=await newsList();if(!ok())return;
const fut=news.filter(x=>x.d>today()).sort((a,b)=>a.d.localeCompare(b.d)),past=news.filter(x=>x.d<=today());
const nnew=news.filter(x=>S.seen[x.id]==='new').length;
const card=x=>`<a class="news" href="#album/${x.id}"><div class="cov">${coverImg(x.id,x.artist,x.t,500)}${S.seen[x.id]==='new'?'<span class="badge">Nuovo</span>':''}</div><div class="t">${esc(x.t)}</div><div class="a">${esc(x.artist)}</div><div class="m"><span class="chip" style="margin:0">${typeOf(x)}</span>${whenBadge(x.d)||`<span class="small muted">${fmtDate(x.d)}</span>`}</div></a>`;
const otd=await onThisDay();if(!ok())return;
let html='';
if(fut.length)html+=`<div class="sec"><h2>In arrivo</h2></div><div class="hscroll">${fut.map(card).join('')}</div>`;

function letterOf(n){const c=sortName(n).normalize('NFD').replace(/[\u0300-\u036f]/g,'').charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'}
function attachIndex(){document.querySelectorAll('.azidx,.azbig').forEach(e=>e.remove());const marks=[...document.querySelectorAll('[data-az]')];if(marks.length<8)return;

big.textContent=l;big.classList.add('on');clearTimeout(to);to=setTimeout(()=>big.classList.remove('on'),600)};

/* ---------- SPOTIFY ---------- */
const redirectUri=()=>location.origin+location.pathname;
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
window.spLogin=async function(){if(!S.settings.sp){toast('Inserisci prima il Client ID di Spotify');go('impostazioni');return}
const v=b64url(crypto.getRandomValues(new Uint8Array(48)));localStorage.setItem('ol-pkce',v);const ch=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:S.settings.sp,response_type:'code',redirect_uri:redirectUri(),code_challenge_method:'S256',code_challenge:ch,scope:'user-follow-read user-top-read user-library-read'})};
async function spCallback(){const p=new URLSearchParams(location.search);const code=p.get('code'),err=p.get('error');if(!code&&!err)return;history.replaceState(null,'',location.pathname+location.hash);
if(err){toast('Accesso a Spotify annullato');return}
try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:redirectUri(),client_id:S.settings.sp,code_verifier:localStorage.getItem('ol-pkce')||''})});
const j=await r.json();if(!j.access_token)throw new Error(j.error_description||j.error||'token');await spImport(j.access_token)}catch(e){toast('Spotify: '+e.message)}}
async function spImport(tok){const s=sheet(`<h2>Importo da Spotify…</h2><div class="load"><div class="spin"></div></div>`);const H={Authorization:'Bearer '+tok};const get=async u=>{const r=await fetch(u,{headers:H});if(!r.ok)throw new Error('Spotify '+r.status);return r.json()};
const C={};const add=(a,tag)=>{if(!a||!a.id)return;const c=C[a.id]||(C[a.id]={id:a.id,name:a.name,img:(a.images||[]).slice(-2)[0]?.url||'',tags:new Set()});tag&&c.tags.add(tag);if(!c.img&&a.images?.length)c.img=a.images.slice(-2)[0].url};
try{let u='https://api.spotify.com/v1/me/following?type=artist&limit=50';while(u){const j=await get(u);(j.artists.items||[]).forEach(a=>add(a,'Segui'));u=j.artists.next}}catch(e){}
for(const tr of['short_term','medium_term','long_term']){try{const j=await get(`https://api.spotify.com/v1/me/top/artists?limit=50&time_range=${tr}`);(j.items||[]).forEach(a=>add(a,'Più ascoltato'))}catch(e){}}
try{let u='https://api.spotify.com/v1/me/albums?limit=50',n=0;while(u&&n<6){const j=await get(u);(j.items||[]).forEach(x=>(x.album?.artists||[]).forEach(a=>add(a,'Album salvati')));u=j.next;n++}}catch(e){}
await spWrapped(get).catch(()=>{});
const L=Object.values(C).filter(c=>!Object.values(S.artists).some(x=>x.spotifyId===c.id)).sort((a,b)=>b.tags.size-a.tags.size||a.name.localeCompare(b.name));
if(!L.length){s.querySelector('.in').innerHTML='<h2>Nessun nuovo artista</h2><p class="muted">Spotify non ha restituito artisti nuovi da importare.</p><button class="btn" onclick="this.closest(\'.sheet\').remove()">Chiudi</button>';return}
const sel=new Set(L.filter(c=>c.tags.has('Segui')||c.tags.has('Più ascoltato')).map(c=>c.id));
const draw=()=>{s.querySelector('.in').innerHTML=`<h2>Scegli i tuoi artisti</h2><p class="small muted">${L.length} trovati su Spotify · ${sel.size} selezionati</p>
<div class="row" style="gap:8px;margin:10px 0"><button class="btn sm ghost" id="sa">Tutti</button><button class="btn sm ghost" id="sn">Nessuno</button></div>
${L.map(c=>`<div class="li" data-id="${c.id}" style="cursor:pointer"><div class="th r">${c.img?`<img src="${esc(c.img)}">`:phHTML(c.name)}</div><div class="tx"><b>${esc(c.name)}</b><span>${[...c.tags].join(' · ')}</span></div><div class="chk ${sel.has(c.id)?'on':''}">${sel.has(c.id)?I.check:''}</div></div>`).join('')}
<div style="position:sticky;bottom:0;padding-top:14px;background:var(--bg2)"><button class="btn" style="width:100%" id="sok">Aggiungi ${sel.size} artisti</button></div>`;
s.querySelectorAll('.li').forEach(r=>r.onclick=()=>{const id=r.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);draw()});
$('#sa',s).onclick=()=>{L.forEach(c=>sel.add(c.id));draw()};$('#sn',s).onclick=()=>{sel.clear();draw()};
$('#sok',s).onclick=async()=>{const pick=L.filter(c=>sel.has(c.id));let i=0,miss=[];for(const c of pick){i++;s.querySelector('.in').innerHTML=`<h2>Collego gli artisti</h2><p class="muted">${i} di ${pick.length}: ${esc(c.name)}</p><div class="load"><div class="spin"></div></div>`;
const m=await spToMb(c);if(m){addArtist(m.id,m.name,{spotifyId:c.id})}else miss.push(c.name)}
s.remove();toast(`${pick.length-miss.length} artisti aggiunti`);if(miss.length)setTimeout(()=>sheet(`<h2>Da cercare a mano</h2><p class="small muted">Non ho trovato con certezza questi artisti: cercali in "Cerca" e tocca ☆.</p>${miss.map(n=>`<div class="li"><div class="tx"><b>${esc(n)}</b></div></div>`).join('')}`),400);
go('home');render();checkNews(true)}};draw()}
/* Wrapped: playlist "I tuoi brani preferiti del ANNO" salvate nella libreria */
async function spWrapped(get){let u='https://api.spotify.com/v1/me/playlists?limit=50',n=0,found=0;S.wrapped=S.wrapped||{};
while(u&&n<10){const j=await get(u);for(const p of j.items||[]){if(!p)continue;const m=(p.name||'').match(/(top songs|brani preferiti|canzoni preferite|wrapped)\D*((19|20)\d\d)/i);if(!m)continue;const y=m[2];
let items=[];for(const ep of['items','tracks']){try{const k=await get(`https://api.spotify.com/v1/playlists/${p.id}/${ep}?limit=100`);items=k.items||[];break}catch(e){}}
const tr=items.map(x=>x.item||x.track).filter(Boolean).map(t=>({t:t.name,a:(t.artists||[]).map(a=>a.name).join(', '),al:t.album?.name||''}));
if(tr.length){const w=S.wrapped[y]||(S.wrapped[y]={});w.pl=tr;w.plName=p.name;found++}}u=j.next;n++}
if(found)save();return found}
/* Cronologia completa dall'esportazione dati di Spotify */
window.importHistory=async function(inp){const files=[...inp.files];if(!files.length)return;toast('Analizzo la cronologia…');const Y={};let rows=0;
for(const f of files){let d;try{d=JSON.parse(await f.text())}catch(e){continue}if(!Array.isArray(d))continue;
for(const r of d){const ms=r.ms_played??r.msPlayed??0;const t=r.master_metadata_track_name??r.trackName;const a=r.master_metadata_album_artist_name??r.artistName;const al=r.master_metadata_album_album_name||'';const ts=r.ts||r.endTime||'';if(!t||!a||!ts)continue;
const y=ts.slice(0,4);const o=Y[y]||(Y[y]={ms:0,plays:0,A:{},T:{},AL:{},days:new Set()});o.ms+=ms;rows++;if(ms<30000)continue;o.plays++;o.days.add(ts.slice(0,10));
(o.A[a]=o.A[a]||{n:a,ms:0,p:0});o.A[a].ms+=ms;o.A[a].p++;const tk=t+'\u0001'+a;(o.T[tk]=o.T[tk]||{t,a,ms:0,p:0});o.T[tk].ms+=ms;o.T[tk].p++;
if(al){const ak=al+'\u0001'+a;(o.AL[ak]=o.AL[ak]||{t:al,a,ms:0,p:0});o.AL[ak].ms+=ms;o.AL[ak].p++}}}
if(!rows){toast('File non riconosciuti');return}S.wrapped=S.wrapped||{};const top=(o,k)=>Object.values(o).sort((x,y)=>y[k]-x[k]).slice(0,30);
for(const[y,o]of Object.entries(Y)){const w=S.wrapped[y]||(S.wrapped[y]={});w.min=Math.round(o.ms/60000);w.plays=o.plays;w.days=o.days.size;w.nart=Object.keys(o.A).length;w.ntr=Object.keys(o.T).length;
w.art=top(o.A,'ms').map(x=>({n:x.n,min:Math.round(x.ms/60000),p:x.p}));w.tr=top(o.T,'p').map(x=>({t:x.t,a:x.a,p:x.p}));w.alb=top(o.AL,'ms').slice(0,15).map(x=>({t:x.t,a:x.a,min:Math.round(x.ms/60000)}))}
save();toast(`Fatto: ${Object.keys(Y).length} anni di ascolti`);coltab='w';go('collezione');render()};
function vWrapped(y){const w=(S.wrapped||{})[y];if(!w)return;const s=sheet(`<div class="small" style="color:var(--gold);font-weight:700;letter-spacing:.14em;text-transform:uppercase">Il mio anno in musica</div><h1 style="font-size:52px;line-height:1;margin:4px 0 16px">${y}</h1>
${w.min!=null?`<div class="stats"><div class="stat"><b>${w.min.toLocaleString('it-IT')}</b><span>minuti di ascolto</span></div><div class="stat"><b>${w.nart.toLocaleString('it-IT')}</b><span>artisti diversi</span></div><div class="stat"><b>${w.ntr.toLocaleString('it-IT')}</b><span>brani diversi</span></div><div class="stat"><b>${w.days}</b><span>giorni con musica</span></div></div>`:''}
${w.art?`<div class="sec"><h2>I miei artisti</h2></div>${w.art.slice(0,10).map((a,i)=>`<div class="li"><span class="no" style="width:24px;font-family:var(--serif);font-size:20px;color:var(--gold)">${i+1}</span>${avatar(a.n,'th r')}<div class="tx"><b>${esc(a.n)}</b><span>${a.min.toLocaleString('it-IT')} minuti · ${a.p} ascolti</span></div></div>`).join('')}`:''}
${w.tr?`<div class="sec"><h2>I miei brani</h2></div>${w.tr.slice(0,20).map((t,i)=>`<div class="trk"><span class="no">${i+1}</span><span class="tt">${esc(t.t)}<br><span class="small muted">${esc(t.a)} · ${t.p} ascolti</span></span><button class="play" data-a="${esc(t.a)}" data-t="${esc(t.t)}" onclick="playPrev(this)">${I.play}</button>${spBtn(t.a,t.t)}</div>`).join('')}`:''}
${w.alb?`<div class="sec"><h2>I miei album</h2></div>${w.alb.slice(0,10).map((t,i)=>`<div class="trk"><span class="no">${i+1}</span><span class="tt">${esc(t.t)}<br><span class="small muted">${esc(t.a)} · ${t.min} minuti</span></span></div>`).join('')}`:''}
${w.pl?`<div class="sec"><h2>${esc(w.plName||'Playlist Wrapped')}</h2></div>${w.pl.map((t,i)=>`<div class="trk"><span class="no">${i+1}</span><span class="tt">${esc(t.t)}<br><span class="small muted">${esc(t.a)}</span></span><button class="play" data-a="${esc(t.a.split(', ')[0])}" data-t="${esc(t.t)}" onclick="playPrev(this)">${I.play}</button>${spBtn(t.a.split(', ')[0],t.t)}</div>`).join('')}`:''}`)}
window.vWrapped=vWrapped;
async function spToMb(c){try{const j=await mb(`url?resource=${enc('https://open.spotify.com/artist/'+c.id)}&inc=artist-rels`);const r=(j.relations||[]).find(x=>x.artist);if(r)return{id:r.artist.id,name:r.artist.name}}catch(e){}
try{const j=await mb(`artist?query=${enc('artist:"'+c.name+'"')}&limit=5`);const a=(j.artists||[]).find(x=>norm(x.name)===norm(c.name)&&x.score>=90);if(a)return{id:a.id,name:a.name}}catch(e){}return null}

/* ---------- SYNC GitHub ---------- */
const ghH=()=>({Authorization:'Bearer '+K.gh,Accept:'application/vnd.github+json'});
const ghU=()=>`https://api.github.com/repos/${K.ghUser}/${K.ghRepo}/contents/data.json`;
async function ghGet(){const r=await fetch(ghU()+'?t='+Date.now(),{headers:ghH(),cache:'no-store'});if(r.status===404)return{data:null,sha:null};if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();
const bin=atob(j.content.replace(/\n/g,''));const txt=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));return{data:JSON.parse(txt),sha:j.sha}}
async function ghPut(sha){const bytes=new TextEncoder().encode(JSON.stringify(S));let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));
const r=await fetch(ghU(),{method:'PUT',headers:ghH(),body:JSON.stringify({message:'OutLoud! sync',content:btoa(bin),...(sha?{sha}:{})})});if(!r.ok)throw new Error('GitHub '+r.status)}
let syncing=false;
async function syncNow(pushOnly=false){if(!K.gh||syncing)return;syncing=true;try{const{data,sha}=await ghGet();
const localEmpty=!Object.keys(S.artists).length&&!Object.keys(S.albums).length&&!S.diary.length;
if(data&&localEmpty&&Object.keys(data.artists||{}).length){S=Object.assign(blank(),data);localStorage.setItem(LS,JSON.stringify(S));render();return'pulled'}
const remoteEmpty=!data||(!Object.keys(data.artists||{}).length&&!Object.keys(data.albums||{}).length&&!(data.diary||[]).length);
if(!localEmpty&&remoteEmpty){S.updatedAt=Date.now();localStorage.setItem(LS,JSON.stringify(S));await ghPut(sha);return'pushed'}
if(data&&!pushOnly&&(data.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),data);localStorage.setItem(LS,JSON.stringify(S));render();return'pulled'}
if(!data||(S.updatedAt||0)>(data.updatedAt||0)){if(data&&localEmpty)return'same';await ghPut(sha);return'pushed'}return'same'}finally{syncing=false}}

/* ---------- IMPOSTAZIONI ---------- */
function vSettings(app){const perm='Notification'in window?Notification.permission:'unsupported';
app.innerHTML=`<a class="iconbtn back" href="#home">${I.back}</a><div style="padding-top:50px"><h1 style="font-size:30px;margin-bottom:18px">Impostazioni</h1>
<div class="card"><h3 style="font-size:19px">Spotify</h3><p class="small muted" style="line-height:1.5">Importa gli artisti che segui e quelli che ascolti di più. Redirect URI da usare su Spotify:<br><b style="color:var(--tx);word-break:break-all">${esc(redirectUri())}</b></p>
<div class="field"><label>Client ID</label><input id="sp" value="${esc(S.settings.sp)}" placeholder="incolla qui il Client ID"></div><button class="btn sm" onclick="saveSet();spLogin()">Importa da Spotify</button></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Concerti (Ticketmaster)</h3><p class="small muted" style="line-height:1.5">Chiave gratuita da developer.ticketmaster.com (la "Consumer Key").</p><div class="field"><label>Chiave</label><input id="tm" value="${esc(S.settings.tm)}"></div><button class="btn sm ghost" onclick="saveSet();toast('Salvato')">Salva</button></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Sincronizzazione</h3><p class="small muted" style="line-height:1.5">Come per Visto!: i dati restano nel repository privato su GitHub e si allineano tra iPhone, iPad e PC.</p>
<div class="field"><label>Utente GitHub</label><input id="ghu" value="${esc(K.ghUser)}"></div><div class="field"><label>Repository privato</label><input id="ghr" value="${esc(K.ghRepo)}"></div><div class="field"><label>Token</label><input id="ght" type="password" value="${esc(K.gh)}" placeholder="github_pat_…"></div>
<button class="btn sm" onclick="saveSet();doSync()">Salva e sincronizza</button></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Notifiche e aspetto</h3>
<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:10px">${perm==='granted'?'<span class="pill">Notifiche attive ✓</span>':perm==='unsupported'?'<span class="pill">Aggiungi l\'app alla Home per le notifiche</span>':'<button class="btn sm" onclick="askNotif()">Attiva le notifiche</button>'}
<div class="tabs" style="margin:4px 0;flex-basis:100%">${[['dark','Sera'],['day','Giorno'],['auto','Automatico']].map(([k,l])=>`<button class="tab ${K.theme===k?'on':''}" onclick="setTheme('${k}')">${l}</button>`).join('')}</div><button class="btn sm ghost" onclick="checkNews(true);go('home')">Controlla novità ora</button></div></div>
<div class="card" style="margin-top:14px"><h3 style="font-size:19px">Backup</h3><div class="row" style="gap:8px;margin-top:10px"><button class="btn sm ghost" onclick="exportData()">Esporta</button><label class="btn sm ghost">Importa<input type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div></div>
<div class="sign">OutLoud! ${VER}<br>Stefano Fasolato 🖤💙</div></div>`}
window.saveSet=()=>{S.settings.sp=$('#sp').value.trim();S.settings.tm=$('#tm').value.trim();K.ghUser=$('#ghu').value.trim()||OWNER_DEFAULT;K.ghRepo=$('#ghr').value.trim()||'outloud-dati';K.gh=$('#ght').value.trim();saveKeys();save(false,false)};
window.doSync=async()=>{if(!K.gh)return toast('Inserisci il token');try{const r=await syncNow();toast(r==='pulled'?'Dati scaricati da GitHub':r==='pushed'?'Dati salvati su GitHub':'Già allineato')}catch(e){toast('Errore: '+e.message)}};
window.askNotif=async()=>{try{const p=await Notification.requestPermission();toast(p==='granted'?'Notifiche attive':'Notifiche non consentite');render()}catch(e){}};
window.setTheme=t=>{K.theme=t;saveKeys();applyTheme();render()};
const mqDark=matchMedia('(prefers-color-scheme: dark)');mqDark.addEventListener?.('change',()=>{if(K.theme==='auto')applyTheme()});
function isDay(){return K.theme==='day'||(K.theme==='auto'&&!mqDark.matches)}
function applyTheme(){document.body.classList.toggle('day',isDay());document.querySelector('meta[name=theme-color]').content=isDay()?'#f5f0e6':'#0a0a0d'}
window.exportData=()=>{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='outloud-backup.json';a.click()};
window.importData=async inp=>{try{const d=JSON.parse(await inp.files[0].text());S=Object.assign(blank(),d);save();toast('Backup ripristinato');render()}catch(e){toast('File non valido')}};
window.checkNews=checkNews;window.go=go;window.I=I;

/* ---------- INTRO ---------- */
function eqHTML(n,cls=''){return `<div class="eq ${cls}">${Array.from({length:n},(_,i)=>`<b style="animation-delay:${(-(i*137)%900)}ms;animation-duration:${700+((i*53)%500)}ms"></b>`).join('')}</div>`}
async function introCovers(){let urls=wallL.slice().sort(()=>Math.random()-.5);
if(urls.length<24){try{const d=await Promise.race([dz('chart/0/albums?limit=60'),sleep(1200).then(()=>null)]);if(d&&d.data)urls=urls.concat(d.data.map(a=>a.cover_medium).filter(Boolean))}catch(e){}}
return urls.slice(0,72)}
async function intro(){const el=$('#intro');let done=false;const hide=()=>{if(done)return;done=true;el.classList.add('hide');setTimeout(()=>el.style.display='none',1000)};el.onclick=hide;
if(sessionStorage.getItem('ol-intro')){el.style.display='none';return}sessionStorage.setItem('ol-intro',1);
$('#ilogo').innerHTML=[...'Loud!'].map((c,i)=>`<span style="animation-delay:${150+i*110}ms">${c}</span>`).join('');
$('#ieq').outerHTML=eqHTML(22);
const urls=await introCovers();
if(urls.length){const rows=4,per=Math.max(8,Math.ceil(urls.length/rows));let html='';for(let r=0;r<rows;r++){const seg=[];for(let i=0;i<per;i++)seg.push(urls[(r*per+i)%urls.length]);const imgs=seg.map(u=>`<img src="${esc(u)}" style="opacity:0;transition:opacity .6s" onload="this.style.opacity=1" onerror="this.remove()" alt="">`).join('');html+=`<div class="wrow ${r%2?'rev':''}" style="animation-duration:${60+r*12}s">${imgs}${imgs}</div>`}
$('#wall').innerHTML=html;requestAnimationFrame(()=>$('#wall').classList.add('on'))}
setTimeout(hide,4300)}

/* ---------- avvio ---------- */
applyTheme();intro();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{await spCallback();if(K.gh){try{await syncNow()}catch(e){}}setTimeout(()=>checkNews(),1500)})();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(K.gh)syncNow().catch(()=>{});checkNews()}});
</script>
